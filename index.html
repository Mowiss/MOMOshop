<style>
:root{
  --g950:#0b0f17; --g900:#111827; --g850:#18202e; --g800:#1f2937; --g750:#2b3544; --g700:#374151; --g600:#4b5563; --g500:#6b7280; --g400:#9ca3af; --g300:#d1d5db; --g200:#e5e7eb;
  --amber:#fcd34d; --brand:#8b0000; --brand2:#b91c1c; --brand3:#f87171; --emerald:#059669;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g900);color:var(--g200);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- Header ---------- */
header{background:var(--g800);border-bottom:1px solid var(--g700);display:flex;align-items:center;gap:8px;padding:8px 8px;box-shadow:0 2px 6px #0006;z-index:20;flex-wrap:nowrap;min-height:54px}
.logo{display:flex;align-items:center;gap:8px;margin-right:6px;flex:none}
.logo img{height:36px;width:auto;display:block;filter:drop-shadow(0 1px 1px #0008)}
.logo h1{margin:0;font-size:24px;font-weight:900;font-style:italic;letter-spacing:-1px;white-space:nowrap}
.logo h1 b{color:var(--brand3)}
.hgroup{display:flex;align-items:center;gap:4px;padding:3px;background:var(--g850);border:1px solid var(--g700);border-radius:7px;flex:none}
.hbtn{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g700);border:1px solid var(--g600);border-radius:5px;cursor:pointer;color:var(--g200);white-space:nowrap}
.hbtn:hover{background:var(--g600)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg{width:18px;height:18px;flex:none}
.hbtn.ico{padding:0}
.hbtn.install{background:var(--emerald);border-color:#10b981;color:#fff;font-weight:600}
.hbtn.install:hover{background:#10b981}
.spacer{flex:1}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:var(--g800);border:1px solid var(--g600);border-radius:8px;box-shadow:0 12px 30px #000a;padding:5px;z-index:100}
.menu.right{left:auto;right:0}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;padding:6px 10px;background:none;border:0;border-radius:5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--g700)}
.menu button kbd{font:11px ui-monospace,monospace;color:var(--amber);opacity:.85}
.menu hr{border:0;border-top:1px solid var(--g700);margin:4px 2px}
.menu .mlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--g500);padding:6px 10px 2px}
.doc-name{font-weight:600;color:var(--g300);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.doc-name .dirty{color:var(--amber)}

/* ---------- Barre d'options ---------- */
#optbar{background:var(--g850);border-bottom:1px solid var(--g700);height:42px;display:flex;align-items:center;gap:14px;padding:0 12px;overflow-x:auto;overflow-y:hidden;flex:none}
#optbar .tname{font-weight:700;color:var(--amber);text-transform:uppercase;font-size:11px;letter-spacing:.08em;white-space:nowrap;display:flex;align-items:center;gap:6px}
#optbar .tname svg{width:16px;height:16px}
#optbar label{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--g300)}
#optbar input[type=range]{width:110px;accent-color:var(--brand2)}
#optbar .num{width:52px;background:var(--g900);border:1px solid var(--g600);border-radius:4px;padding:3px 5px;text-align:right}
#optbar select{background:var(--g900);border:1px solid var(--g600);border-radius:4px;padding:3px 5px}
#optbar .seg{display:flex;border:1px solid var(--g600);border-radius:5px;overflow:hidden}
#optbar .seg button{background:var(--g800);border:0;border-right:1px solid var(--g600);padding:4px 9px;cursor:pointer;display:flex;align-items:center}
#optbar .seg button:last-child{border-right:0}
#optbar .seg button.on{background:var(--brand);color:#fff}
#optbar .seg button svg{width:16px;height:16px}
#optbar .hint{color:var(--g500);white-space:nowrap;font-size:12px}
#optbar .obtn{background:var(--g700);border:1px solid var(--g600);border-radius:5px;padding:4px 10px;cursor:pointer;white-space:nowrap}
#optbar .obtn:hover{background:var(--g600)}
#optbar .obtn.ok{background:var(--emerald);border-color:#10b981;color:#fff}
#optbar .sep{width:1px;height:22px;background:var(--g700)}

/* ---------- Corps ---------- */
main{flex:1;display:flex;min-height:0}
aside.tools{width:138px;background:var(--g800);border-right:1px solid var(--g700);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px;overflow-y:auto;box-shadow:2px 0 6px #0005;z-index:10;flex:none}
.tgroup{width:122px;border:1px solid var(--g700);border-radius:7px;padding:5px;background:var(--g850)}
.tgroup .gl{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--g500);text-align:center;margin:-1px 0 4px}
.tgrid{display:grid;grid-template-columns:repeat(3,34px);gap:4px;justify-content:center}
.tsep{grid-column:1/-1;height:1px;background:var(--g700);margin:2px 3px}
.tool-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--g700);border:1px solid var(--g600);border-radius:5px;cursor:pointer;color:var(--g200);padding:0}
.tool-btn:hover{background:var(--g600)}
.tool-btn.active{background:var(--brand);border-color:var(--brand3);color:#fff;box-shadow:0 0 0 1px #f8717155,inset 0 0 6px #0006}
.tool-btn svg{width:18px;height:18px}
.colors{position:relative;width:86px;height:70px;margin:2px auto 0}
.sw{position:absolute;width:44px;height:44px;border:2px solid var(--g200);border-radius:5px;box-shadow:0 0 0 1px #000,0 2px 6px #0008;cursor:pointer}
#sw1{left:6px;top:4px;z-index:2}
#sw2{left:30px;top:22px;z-index:1}
#sw-swap,#sw-reset{position:absolute;background:none;border:0;cursor:pointer;color:var(--g400);padding:2px}
#sw-swap{right:0;top:0}
#sw-reset{left:0;bottom:-2px}
#sw-swap svg,#sw-reset svg{width:14px;height:14px}
#sw-swap:hover,#sw-reset:hover{color:#fff}

#stage{flex:1;position:relative;overflow:hidden;background:#2a2f38;min-width:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#textedit{position:absolute;background:rgba(255,255,255,.04);border:1px dashed #fcd34d;outline:none;resize:none;overflow:hidden;padding:0;margin:0;white-space:pre;line-height:1.2;min-width:20px;z-index:5}
#dropzone{position:absolute;inset:10px;border:3px dashed var(--amber);border-radius:12px;background:#0008;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--amber);pointer-events:none;z-index:8}

aside.panels{width:268px;background:var(--g800);border-left:1px solid var(--g700);display:flex;flex-direction:column;flex:none;min-height:0;box-shadow:-2px 0 6px #0005;z-index:10}
.panel{border-bottom:1px solid var(--g700);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--g850);border-bottom:1px solid var(--g700);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--g400);cursor:pointer}
.ph .chev{transition:transform .15s}
.panel.collapsed .pb{display:none}
.panel.collapsed .ph .chev{transform:rotate(-90deg)}
.pb{padding:9px 10px}
#pn-layers{flex:1}
#pn-layers .pb{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px}

/* couleur */
#sv{width:246px;height:140px;border-radius:5px;cursor:crosshair;display:block;border:1px solid var(--g600)}
#hue{width:246px;height:14px;border-radius:4px;cursor:pointer;display:block;margin-top:7px;border:1px solid var(--g600)}
.crow{display:flex;align-items:center;gap:6px;margin-top:8px}
.crow input{background:var(--g900);border:1px solid var(--g600);border-radius:4px;padding:3px 6px;width:84px;font-family:ui-monospace,monospace}
.crow .cprev{width:28px;height:22px;border-radius:4px;border:1px solid var(--g500)}
.crow .rgb{color:var(--g400);font:11px ui-monospace,monospace}
.mini{background:var(--g700);border:1px solid var(--g600);border-radius:4px;cursor:pointer;padding:3px 7px;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.mini:hover{background:var(--g600)}
.mini svg{width:14px;height:14px}
#favs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
#favs div{aspect-ratio:1;border-radius:3px;border:1px solid #0008;cursor:pointer;box-shadow:inset 0 0 0 1px #fff2}
#favs div:hover{outline:2px solid var(--amber)}

/* calques */
.lprops{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lprops select{flex:1;background:var(--g900);border:1px solid var(--g600);border-radius:4px;padding:3px 4px;min-width:0}
.lprops input[type=range]{flex:1;accent-color:var(--brand2);min-width:0}
.lprops .num{width:46px;background:var(--g900);border:1px solid var(--g600);border-radius:4px;padding:2px 4px;text-align:right}
.lprops .lab{color:var(--g400);font-size:12px;white-space:nowrap}
#layers{flex:1;overflow-y:auto;border:1px solid var(--g700);border-radius:6px;background:var(--g900);min-height:80px}
.lrow{display:flex;align-items:center;gap:7px;padding:5px 6px;border-bottom:1px solid var(--g800);cursor:pointer;position:relative}
.lrow:hover{background:var(--g850)}
.lrow.active{background:#5a1010;box-shadow:inset 3px 0 0 var(--brand3)}
.lrow.drop-above::before,.lrow.drop-below::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--amber)}
.lrow.drop-above::before{top:-1px}.lrow.drop-below::after{bottom:-1px}
.lrow .vis,.lrow .lock{background:none;border:0;cursor:pointer;color:var(--g300);padding:2px;display:flex}
.lrow .vis svg,.lrow .lock svg{width:16px;height:16px}
.lrow .vis.off{color:var(--g600)}
.lrow .lock{color:var(--g600)}
.lrow .lock.on{color:var(--amber)}
.lrow canvas{width:46px;height:34px;border:1px solid var(--g600);border-radius:3px;flex:none;background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/8px 8px}
.lrow .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lmeta{font-size:10px;color:var(--g500)}
.lrow input.rn{width:100%;background:var(--g900);border:1px solid var(--amber);border-radius:3px;padding:1px 4px}
.lbar{display:flex;gap:4px;margin-top:7px;justify-content:space-between}
.lbar .mini{padding:4px 6px}

footer{height:26px;background:var(--g800);border-top:1px solid var(--g700);display:flex;align-items:center;gap:16px;padding:0 10px;font-size:12px;color:var(--g400);flex:none}
footer b{color:var(--g200);font-weight:600}
footer select{background:var(--g900);border:1px solid var(--g600);border-radius:3px;padding:0 3px;font-size:12px}

/* dialogues */
.ovl{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:500}
.dlg{background:var(--g800);border:1px solid var(--g600);border-radius:10px;box-shadow:0 20px 60px #000c;min-width:340px;max-width:92vw}
.dlg h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--g700);font-size:14px;display:flex;align-items:center;gap:8px}
.dlg h3::before{content:"";width:4px;height:16px;background:var(--brand2);border-radius:2px}
.dlg .db{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg .df{padding:10px 16px;border-top:1px solid var(--g700);display:flex;justify-content:flex-end;gap:8px}
.dlg .row{display:flex;align-items:center;gap:10px}
.dlg .row>span:first-child{width:120px;color:var(--g400)}
.dlg input[type=text],.dlg input[type=number],.dlg select{background:var(--g900);border:1px solid var(--g600);border-radius:5px;padding:5px 7px;flex:1;min-width:0}
.dlg input[type=range]{flex:1;accent-color:var(--brand2)}
.dlg .val{width:46px;text-align:right;font-family:ui-monospace,monospace;color:var(--amber)}
.dlg .note{font-size:12px;color:var(--g500)}
.btn{padding:6px 14px;border-radius:5px;border:1px solid var(--g600);background:var(--g700);cursor:pointer}
.btn:hover{background:var(--g600)}
.btn.primary{background:var(--brand);border-color:var(--brand2);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.presets{display:flex;flex-wrap:wrap;gap:5px}
.presets button{font-size:12px}
.anchor{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.anchor button{width:26px;height:26px;background:var(--g700);border:1px solid var(--g600);border-radius:3px;cursor:pointer}
.anchor button.on{background:var(--brand2)}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--g700);border:1px solid var(--g500);padding:9px 16px;border-radius:8px;box-shadow:0 8px 24px #000a;z-index:600;display:flex;gap:12px;align-items:center;max-width:80vw}
.custom-scroll::-webkit-scrollbar,#layers::-webkit-scrollbar,aside::-webkit-scrollbar{width:8px;height:8px}
#layers::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb,#optbar::-webkit-scrollbar-thumb{background:var(--g600);border-radius:4px}
#optbar::-webkit-scrollbar{height:5px}
</style>
</head>

/* =====================================================================

/* ---------------- outils ---------------- */
const TOOLS = [
  { group: 'Sélection', items: [
    { id: 'move', name: 'Déplacer', key: 'V' }, { id: 'marquee', name: 'Sélection rectangulaire', key: 'M' }, { id: 'ellsel', name: 'Sélection elliptique', key: 'O' },
    { id: 'lasso', name: 'Lasso', key: 'L' }, { id: 'wand', name: 'Baguette magique', key: 'W' }, { id: 'crop', name: 'Recadrage', key: 'C' } ] },
  { group: 'Peinture', items: [
    { id: 'brush', name: 'Pinceau', key: 'B' }, { id: 'pencil', name: 'Crayon', key: 'N' }, { id: 'eraser', name: 'Gomme', key: 'E' },
    { id: 'bucket', name: 'Pot de peinture', key: 'G' }, { id: 'gradient', name: 'Dégradé', key: 'Q' }, { id: 'picker', name: 'Pipette', key: 'I' } ] },
  { group: 'Formes & texte', items: [
    { id: 'text', name: 'Texte', key: 'T' }, { id: 'rect', name: 'Rectangle', key: 'R' }, { id: 'ellipse', name: 'Ellipse', key: 'U' },
    { id: 'line', name: 'Ligne', key: 'Y' } ] },
  { group: 'Vue', items: [ { id: 'hand', name: 'Main (Espace)', key: 'H' }, { id: 'zoom', name: 'Loupe', key: 'Z' } ] },
];
const TOOL_BY_ID = {}; TOOLS.forEach(g => g.items.forEach(t => TOOL_BY_ID[t.id] = t));
const PAINT_TOOLS = ['brush', 'pencil', 'eraser'];
const EDIT_TOOLS = ['brush', 'pencil', 'eraser', 'bucket', 'gradient', 'rect', 'ellipse', 'line', 'move'];

const OPT_DEFAULTS = {
  size: 20, hard: 80, opacity: 100, pSize: 2, pOpacity: 100, eSize: 30, eHard: 80, eOpacity: 100,
  tol: 32, contig: true, sample: 'layer', bOpacity: 100, wTol: 32, wContig: true, wSample: 'merged',
  gType: 'linear', gMode: 'c2', gOpacity: 100, font: 'Arial', fSize: 48, bold: false, italic: false,
  shMode: 'fill', shWidth: 4, shOpacity: 100, lnWidth: 4, lnOpacity: 100, selMode: 'new', pkSample: 'merged'

let opts = Object.assign({}, OPT_DEFAULTS);
try { Object.assign(opts, JSON.parse(localStorage.getItem('momoshop.opts') || '{}')); } catch (e) {}

/* ---------------- état ---------------- */
let doc = null;          // { name, w, h, layers:[bas→haut], active }
let uid = 1;
let tool = 'brush';
let color1 = '#000000', color2 = '#ffffff';
let sel = null;          // { mask:canvas(doc), segs:Float32Array, bbox:{x,y,w,h} }
let cam = { z: 1, x: 0, y: 0 };
let override = null;     // { layer, canvas } : affichage provisoire d'un calque (aperçu trait / filtre)
let dirty = false, fileHandle = null;
let undoStack = [], redoStack = [];
const MAX_HISTORY = 40;

function newLayer(name, w, h) { return { id: uid++, name, canvas: mkCanvas(w, h), visible: true, locked: false, opacity: 1, blend: 'source-over', x: 0, y: 0 }; }
const L = () => doc.layers[doc.active];

/* ---------------- historique ----------------
   'px'  : pixels d'un canvas (copie avant)  — les modifs de pixels se font en place
   'doc' : structure du document (liste des calques, propriétés, taille) — les opérations

function snapshotDoc() { return { w: doc.w, h: doc.h, active: doc.active, layers: doc.layers.map(l => ({ ...l })) }; }

function pushDoc() { pushHist({ t: 'doc', state: snapshotDoc() }); }
function swapEntry(e) {

function undo() { cancelTransient(); const e = undoStack.pop(); if (!e) return; swapEntry(e); redoStack.push(e); afterHistory(); }
function redo() { cancelTransient(); const e = redoStack.pop(); if (!e) return; swapEntry(e); undoStack.push(e); afterHistory(); }

function updateUndoBtns() { $('#btn-undo').disabled = !undoStack.length; $('#btn-redo').disabled = !redoStack.length; }
function markDirty(v = true) { dirty = v; updateTitle(); }
function updateTitle() {
  if (!doc) return;
  $('#docname').innerHTML = esc(doc.name) + (dirty ? ' <span class="dirty">●</span>' : '');
  document.title = (dirty ? '● ' : '') + doc.name + ' — MOMO Shop';
}

/* ---------------- document ---------------- */
function createDoc(w, h, bg = '#ffffff', name = 'Sans titre') {
  doc = { name, w, h, layers: [], active: 0 };
  const l = newLayer('Fond', w, h);
  if (bg && bg !== 'transparent') { const c = l.canvas.getContext('2d'); c.fillStyle = bg; c.fillRect(0, 0, w, h); }
  else l.name = 'Calque 1';

}
function afterNewDoc() {

  ensureBuffers(); fit(); renderLayers(); markDirty(false); updateStatus(); updateUndoBtns(); req(true);

let comp = mkCanvas(1, 1), effect = mkCanvas(1, 1), work = mkCanvas(1, 1);
function ensureBuffers() {
  if (comp.width !== doc.w || comp.height !== doc.h) { comp = mkCanvas(doc.w, doc.h); effect = mkCanvas(doc.w, doc.h); }
}
function layerFromImage(img, x, y, name) {
  // le canvas du calque couvre l'union du document et de l'image (rien n'est rogné à l'import)
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const ux = Math.min(0, x), uy = Math.min(0, y), ux2 = Math.max(doc.w, x + iw), uy2 = Math.max(doc.h, y + ih);
  const l = newLayer(name, ux2 - ux, uy2 - uy); l.x = ux; l.y = uy;
  l.canvas.getContext('2d').drawImage(img, x - ux, y - uy);
  return l;
}
function insertLayer(l, index = doc.active + 1) { doc.layers.splice(index, 0, l); doc.active = index; }

/* ---------------- composition & rendu ---------------- */
let needComp = true, rafId = 0;

function frame() { rafId = 0; if (needComp) { composite(comp, true); needComp = false; } draw(); }

function getChecker() {

  c.fillStyle = '#ffffff'; c.fillRect(0, 0, 16, 16); c.fillStyle = '#d4d7dc'; c.fillRect(0, 0, 8, 8); c.fillRect(8, 8, 8, 8);

let mouse = { sx: -1, sy: -1, x: 0, y: 0, in: false };
let antsOff = 0;
function draw() {

  const c = vctx; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#2a2f38'; c.fillRect(0, 0, W, H);

    const x0 = Math.max(0, Math.floor(-sx / cam.z)), x1 = Math.min(doc.w, Math.ceil((W - sx) / cam.z));
    const y0 = Math.max(0, Math.floor(-sy / cam.z)), y1 = Math.min(doc.h, Math.ceil((H - sy) / cam.z));
    for (let x = x0; x <= x1; x++) { const X = Math.round(sx + x * cam.z) + .5; c.moveTo(X, sy + y0 * cam.z); c.lineTo(X, sy + y1 * cam.z); }
    for (let y = y0; y <= y1; y++) { const Y = Math.round(sy + y * cam.z) + .5; c.moveTo(sx + x0 * cam.z, Y); c.lineTo(sx + x1 * cam.z, Y); }
    c.stroke(); c.restore();
  }

async function saveDoc(as) {
  if (textEdit) commitText();
  const data = serialize(), blob = new Blob([data], { type: 'application/x-momoshop' });
  if (!as && fileHandle) {
    try { const w = await fileHandle.createWritable(); await w.write(blob); await w.close(); markDirty(false); toast('Enregistré.'); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName: doc.name + '.mms', types: [{ description: 'Document MOMO Shop (multicalques)', accept: { 'application/x-momoshop': ['.mms'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); fileHandle = h;
      doc.name = h.name.replace(/\.mms$/i, ''); markDirty(false); toast('Enregistré : ' + h.name); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const name = as || !fileHandle ? await promptDlg('Nom du fichier', doc.name) : doc.name; if (name == null) return;
  doc.name = name.replace(/\.mms$/i, ''); download(blob, doc.name + '.mms'); markDirty(false);
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const FMT = { png: { mime: 'image/png', ext: 'png', label: 'PNG' }, jpeg: { mime: 'image/jpeg', ext: 'jpg', label: 'JPEG' }, webp: { mime: 'image/webp', ext: 'webp', label: 'WEBP' } };
function flatCanvas(fmt, scale = 1, bg = '#ffffff') {
  const c = mkCanvas(doc.w, doc.h); composite(c, false);
  const w = Math.max(1, Math.round(doc.w * scale)), h = Math.max(1, Math.round(doc.h * scale)), o = mkCanvas(w, h), x = o.getContext('2d');
  if (fmt === 'jpeg') { x.fillStyle = bg; x.fillRect(0, 0, w, h); }
  x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, w, h); return o;
}
async function exportImage(fmt, quality = .92, scale = 1, bg, name) {
  if (textEdit) commitText();
  const F = FMT[fmt], c = flatCanvas(fmt, scale, bg);
  const blob = await new Promise(r => c.toBlob(r, F.mime, quality));
  name = (name || doc.name) + '.' + F.ext;
  if (window.showSaveFilePicker) {
    try { const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'Image ' + F.label, accept: { [F.mime]: ['.' + F.ext] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); toast(`Exporté : ${h.name} (${Math.round(blob.size / 1024)} Ko)`); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  download(blob, name); toast(`Exporté : ${name} (${Math.round(blob.size / 1024)} Ko)`);
}
function exportDialog(fmt0 = 'png') {
  const body = `<div class="row"><span>Nom</span><input type="text" id="x-name" value="${esc(doc.name)}"></div>
    <div class="row"><span>Format</span><select id="x-fmt"><option value="png">PNG — sans perte, transparence</option><option value="jpeg">JPEG — photo, sans transparence</option><option value="webp">WEBP — léger, transparence</option></select></div>
    <div class="row" id="x-qrow"><span>Qualité</span><input type="range" id="x-q" min="10" max="100" value="90"><span class="val" id="x-qv">90</span></div>
    <div class="row" id="x-bgrow"><span>Fond (JPEG)</span><input type="color" id="x-bg" value="#ffffff" style="width:60px;height:28px;background:none;border:0"></div>
    <div class="row"><span>Échelle</span><select id="x-sc"><option value="0.25">25 %</option><option value="0.5">50 %</option><option value="1" selected>100 %</option><option value="2">200 %</option></select></div>
    <div class="note" id="x-info"></div>`;
  return dialog({ title: 'Exporter l\'image', body, ok: 'Exporter', onOpen: r => {
    const f = r.querySelector('#x-fmt'), q = r.querySelector('#x-q'), sc = r.querySelector('#x-sc');
    const upd = () => { r.querySelector('#x-qrow').style.display = f.value === 'png' ? 'none' : ''; r.querySelector('#x-bgrow').style.display = f.value === 'jpeg' ? '' : 'none'; r.querySelector('#x-qv').textContent = q.value;
      r.querySelector('#x-info').textContent = `Sortie : ${Math.round(doc.w * sc.value)} × ${Math.round(doc.h * sc.value)} px — image aplatie (calques visibles)`; };
    f.value = fmt0; f.onchange = q.oninput = sc.onchange = upd; upd(); } })
  .then(r => { if (r) exportImage(r.querySelector('#x-fmt').value, r.querySelector('#x-q').value / 100, +r.querySelector('#x-sc').value, r.querySelector('#x-bg').value, r.querySelector('#x-name').value.trim() || doc.name); });
}

/* ---------------- backup auto (IndexedDB) ---------------- */
const IDB = { db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('momoshop', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } };
let backupTimer = 0, lastBackup = null;
async function doBackup(manual) {
  if (!doc || drag) return;
  try { await IDB.set('backup', { time: Date.now(), name: doc.name, data: serialize() }); lastBackup = Date.now(); updateBackupInfo(); if (manual) toast('Sauvegarde auto effectuée.'); }
  catch (e) { if (manual) toast('Sauvegarde impossible : ' + e.message); }
}
function setBackupInterval(min) {
  clearInterval(backupTimer); try { localStorage.setItem('momoshop.backup', min); } catch (e) {}
  if (+min > 0) backupTimer = setInterval(() => { if (dirty) doBackup(false); }, min * 60000);
  updateBackupInfo();
}
function updateBackupInfo() {
  const min = +$('#backup-int').value;
  $('#backup-lbl').textContent = min ? `Backup ${min} min` : 'Backup off';
  $('#backup-info').textContent = lastBackup ? 'Dernière : ' + new Date(lastBackup).toLocaleTimeString('fr-FR') : 'Aucune sauvegarde';
}
async function restoreBackup() {
  const b = await IDB.get('backup').catch(() => null);
  if (!b) return toast('Aucune sauvegarde auto disponible.');
  if (dirty && !await confirmDlg(`Remplacer le document actuel par la sauvegarde « ${b.name} » du ${new Date(b.time).toLocaleString('fr-FR')} ?`)) return;
  await loadMms(JSON.parse(b.data)); fileHandle = null; markDirty(true); toast('Sauvegarde restaurée.');
}
$('#backup-int').onchange = e => setBackupInterval(+e.target.value);

/* ---------------- dialogues & toasts ---------------- */
function dialog({ title, body, ok = 'OK', cancel = 'Annuler', onOpen }) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ovl';
    o.innerHTML = `<div class="dlg"><h3>${title}</h3><div class="db">${body}</div><div class="df">${cancel ? `<button class="btn" data-cancel>${cancel}</button>` : ''}<button class="btn primary" data-ok>${ok}</button></div></div>`;
    document.body.appendChild(o);
    const close = v => { o.remove(); res(v); };
    o.querySelector('[data-ok]').onclick = () => close(o);
    o.querySelector('[data-cancel]') && (o.querySelector('[data-cancel]').onclick = () => close(null));
    o.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); close(o); } e.stopPropagation(); });
    onOpen && onOpen(o); (o.querySelector('input[type=text],input[type=number]') || o.querySelector('[data-ok]')).focus();
  });
}
const confirmDlg = msg => dialog({ title: 'Confirmation', body: `<div>${esc(msg)}</div>`, ok: 'Continuer' }).then(r => !!r);
const promptDlg = (msg, v) => dialog({ title: msg, body: `<input type="text" id="p-v" value="${esc(v)}">` }).then(r => r ? r.querySelector('#p-v').value.trim() : null);
let toastTimer = 0;
function toast(msg, btn) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (btn) { const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = btn.label; b.onclick = () => { t.remove(); btn.fn(); }; t.appendChild(b); }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), btn ? 12000 : 2800);
}

async function newDocDialog() {
  if (dirty && !await confirmDlg('Le document actuel n\'est pas enregistré. Continuer ?')) return;
  const P = [['HD 1920×1080', 1920, 1080], ['4K 3840×2160', 3840, 2160], ['Carré 1080', 1080, 1080], ['A4 150 dpi', 1240, 1754], ['A4 300 dpi', 2480, 3508], ['A3 300 dpi', 3508, 4961], ['Icône 512', 512, 512], ['800×600', 800, 600]];
  const body = `<div class="row"><span>Nom</span><input type="text" id="n-name" value="Sans titre"></div>
    <div class="presets">${P.map((p, i) => `<button class="mini" data-p="${i}">${p[0]}</button>`).join('')}</div>
    <div class="row"><span>Largeur (px)</span><input type="number" id="n-w" value="1920" min="1" max="12000"></div>
    <div class="row"><span>Hauteur (px)</span><input type="number" id="n-h" value="1080" min="1" max="12000"></div>
    <div class="row"><span>Fond</span><select id="n-bg"><option value="#ffffff">Blanc</option><option value="transparent">Transparent</option><option value="c1">Couleur 1</option><option value="c2">Couleur 2</option></select></div>`;
  const r = await dialog({ title: 'Nouveau document', body, ok: 'Créer', onOpen: o => o.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const p = P[b.dataset.p]; o.querySelector('#n-w').value = p[1]; o.querySelector('#n-h').value = p[2]; }) });
  if (!r) return;
  const w = clamp(+r.querySelector('#n-w').value | 0, 1, 12000), h = clamp(+r.querySelector('#n-h').value | 0, 1, 12000);
  let bg = r.querySelector('#n-bg').value; if (bg === 'c1') bg = color1; if (bg === 'c2') bg = color2;
  createDoc(w, h, bg, r.querySelector('#n-name').value.trim() || 'Sans titre'); fileHandle = null;
}
async function resizeDialog() {
  const body = `<div class="row"><span>Largeur (px)</span><input type="number" id="r-w" value="${doc.w}" min="1" max="12000"></div>
    <div class="row"><span>Hauteur (px)</span><input type="number" id="r-h" value="${doc.h}" min="1" max="12000"></div>
    <div class="row"><span>Pourcentage</span><input type="number" id="r-p" value="100" min="1" max="1000"></div>
    <label class="row note"><input type="checkbox" id="r-k" checked style="accent-color:var(--brand2)"> Conserver les proportions</label>`;
  const r = await dialog({ title: 'Taille de l\'image', body, ok: 'Redimensionner', onOpen: o => {
    const w = o.querySelector('#r-w'), h = o.querySelector('#r-h'), p = o.querySelector('#r-p'), k = o.querySelector('#r-k');
    w.oninput = () => { if (k.checked) h.value = Math.round(w.value * doc.h / doc.w); p.value = Math.round(w.value / doc.w * 100); };
    h.oninput = () => { if (k.checked) w.value = Math.round(h.value * doc.w / doc.h); p.value = Math.round(h.value / doc.h * 100); };
    p.oninput = () => { w.value = Math.round(doc.w * p.value / 100); h.value = Math.round(doc.h * p.value / 100); }; } });
  if (!r) return;
  const w = clamp(+r.querySelector('#r-w').value | 0, 1, 12000), h = clamp(+r.querySelector('#r-h').value | 0, 1, 12000);
  if (w !== doc.w || h !== doc.h) resizeImage(w, h);
}
async function canvasSizeDialog() {
  let anchor = 4;
  const body = `<div class="row"><span>Largeur (px)</span><input type="number" id="c-w" value="${doc.w}" min="1" max="12000"></div>
    <div class="row"><span>Hauteur (px)</span><input type="number" id="c-h" value="${doc.h}" min="1" max="12000"></div>
    <div class="row"><span>Ancrage</span><div class="anchor">${[...Array(9)].map((_, i) => `<button data-a="${i}" class="${i === 4 ? 'on' : ''}"></button>`).join('')}</div></div>`;
  const r = await dialog({ title: 'Taille de la zone de travail', body, ok: 'Appliquer', onOpen: o => o.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { anchor = +b.dataset.a; o.querySelectorAll('[data-a]').forEach(x => x.classList.toggle('on', x === b)); }) });
  if (!r) return;
  const w = clamp(+r.querySelector('#c-w').value | 0, 1, 12000), h = clamp(+r.querySelector('#c-h').value | 0, 1, 12000);
  const ax = anchor % 3, ay = Math.floor(anchor / 3);
  changeCanvas(w, h, Math.round((w - doc.w) * ax / 2), Math.round((h - doc.h) * ay / 2));
}

/* ---------------- actions ---------------- */
function act(a) {
  closeMenus(); if (!doc) return;
  const [k, v] = a.split(':');
  switch (k) {
    case 'new': return newDocDialog();
    case 'open': return openFile();
    case 'save': return saveDoc(false);
    case 'saveas': return saveDoc(true);
    case 'export': return v === 'dialog' ? exportDialog() : exportDialog(v);
    case 'undo': return undo();
    case 'redo': return redo();
    case 'resize': return resizeDialog();
    case 'canvassize': return canvasSizeDialog();
    case 'cropsel': if (!sel) return toast('Aucune sélection.'); return changeCanvas(sel.bbox.w, sel.bbox.h, -sel.bbox.x, -sel.bbox.y);
    case 'trim': return trimTransparent();
    case 'rot': return rotateDoc(+v);
    case 'flipdoc': return flipDoc(v);
    case 'layer': return layerOp(v);
    case 'sel': return v === 'all' ? selectAll() : v === 'none' ? setSelection(null) : v === 'inv' ? invertSel() : selectLayerAlpha();
    case 'copy': return copySel(false);
    case 'cut': if (!editable()) return; return copySel(true);
    case 'pastehint': return toast('Utilise Ctrl+V pour coller (image du presse-papiers ou dernière copie).');
    case 'fill': return fillSelection();
    case 'clear': return clearSelectionPixels();
    case 'flt': return runFilter(v);
    case 'backup': return v === 'now' ? doBackup(true) : restoreBackup();
    case 'install': { const e = window.__installPrompt; if (!e) return toast('Installation proposée par le navigateur (Chrome / Edge) quand l\'appli est servie depuis GitHub Pages.'); e.prompt(); return e.userChoice.then(() => { window.__installPrompt = null; $('#btn-install').classList.add('hidden'); }); }
    case 'fullscreen': return document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  }
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]');
  if (m) { const id = m.dataset.menu, menu = document.getElementById(id), was = !menu.classList.contains('hidden'); closeMenus(); if (!was) menu.classList.remove('hidden'); e.stopPropagation(); return; }
  const b = e.target.closest('[data-act]'); if (b) { act(b.dataset.act); return; }
  if (!e.target.closest('.menu')) closeMenus();
});
function closeMenus() { $$('.menu').forEach(m => m.classList.add('hidden')); }

/* ---------------- statut ---------------- */
const ZOOMS = [.05, .1, .125, .25, .333, .5, .667, .75, 1, 1.5, 2, 3, 4, 6, 8, 12, 16, 32];
function updateStatus() {
  if (!doc) return;
  $('#st-size').textContent = `${doc.w} × ${doc.h} px · ${doc.layers.length} calque${doc.layers.length > 1 ? 's' : ''}`;
  $('#st-sel').textContent = sel ? `${sel.bbox.w} × ${sel.bbox.h} px` : 'aucune';
  const z = $('#st-zoom'), pct = Math.round(cam.z * 1000) / 10;
  z.innerHTML = `<option value="fit">Ajuster</option>` + [...new Set([pct, ...ZOOMS.map(v => Math.round(v * 1000) / 10)])].sort((a, b) => a - b).map(v => `<option value="${v}"${v === pct ? ' selected' : ''}>${v} %</option>`).join('');
  if (textEdit) styleTextEdit();
}
$('#st-zoom').onchange = e => { e.target.value === 'fit' ? fit() : setZoom(+e.target.value / 100); e.target.blur(); };

/* ---------------- glisser-déposer ---------------- */
let dzCount = 0;
stage.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dzCount++; $('#dropzone').classList.remove('hidden'); } });
stage.addEventListener('dragleave', () => { if (--dzCount <= 0) { dzCount = 0; $('#dropzone').classList.add('hidden'); } });
stage.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
stage.addEventListener('drop', e => { e.preventDefault(); dzCount = 0; $('#dropzone').classList.add('hidden');
  const fs = [...e.dataTransfer.files]; const m = fs.find(isMms); if (m) return openAny(m, null); fs.filter(f => f.type.startsWith('image/')).forEach(importAsLayer); });

/* ---------------- ouverture par association de fichiers (appli installée) ---------------- */
if ('launchQueue' in window) launchQueue.setConsumer(async p => { if (!p.files || !p.files.length) return; const h = p.files[0], f = await h.getFile(); openAny(f, isMms(f) ? h : null); });

window.addEventListener('beforeunload', e => { if (dirty) { doBackup(false); e.preventDefault(); e.returnValue = ''; } });

/* ---------------- démarrage ---------------- */
buildTools(); renderFavs();
createDoc(1920, 1080, '#ffffff');
setTool(TOOL_BY_ID[localStorage.getItem('momoshop.tool')] ? localStorage.getItem('momoshop.tool') : 'brush');
window.addEventListener('pagehide', () => { try { localStorage.setItem('momoshop.tool', tool); } catch (e) {} });
setColor1('#000000');
$('#backup-int').value = localStorage.getItem('momoshop.backup') ?? '5'; setBackupInterval(+$('#backup-int').value);
updateUndoBtns();
IDB.get('backup').then(b => { if (b) { lastBackup = b.time; updateBackupInfo(); toast(`Sauvegarde auto trouvée : « ${b.name} » (${new Date(b.time).toLocaleString('fr-FR')})`, { label: 'Restaurer', fn: restoreBackup }); } }).catch(() => {});
</script>
