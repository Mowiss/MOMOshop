<style>
:root{
  --g950:#0b0f17; --g900:#111827; --g850:#18202e; --g800:#1f2937; --g750:#2b3544; --g700:#374151; --g600:#4b5563; --g500:#6b7280; --g400:#9ca3af; --g300:#d1d5db; --g200:#e5e7eb;
  --amber:#fcd34d; --brand:#8b0000; --brand2:#b91c1c; --brand3:#f87171; --emerald:#059669;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g900);color:var(--g200);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- Header ---------- */
header{background:var(--g800);border-bottom:1px solid var(--g700);display:flex;align-items:center;gap:8px;padding:8px 8px;z-index:20;flex-wrap:nowrap;min-height:54px}
.wordmark{margin:0 8px 0 4px;flex:none;line-height:0}
.wordmark img{height:26px;width:auto;display:block}
@media (max-width:1250px){.wordmark img{height:20px}}
.hbtn .chev{width:11px;height:11px;opacity:.7;margin-left:-2px}
.hbtn.wchev{padding:0 5px 0 7px;gap:3px}
.hgroup{display:flex;align-items:center;gap:4px;padding:3px;background:var(--g850);border:1px solid var(--g700);border-radius:7px;flex:none}
.hbtn{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g700);border:1px solid var(--g600);border-radius:5px;cursor:pointer;color:var(--g200);white-space:nowrap}
.hbtn:hover{background:var(--g600)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg{width:18px;height:18px;flex:none}
.hbtn .chev{color:var(--g400)}
[data-act="undo"] svg,[data-act="redo"] svg{color:#fcd34d}
[data-act="new"] svg{color:#4ade80}
[data-menu="m-image"] svg:first-child{color:#60a5fa}
[data-menu="m-layer"] svg:first-child{color:#a78bfa}
[data-menu="m-sel"] svg:first-child{color:#22d3ee}
[data-menu="m-filters"] svg:first-child{color:#f472b6}
[data-act="fullscreen"] svg{color:#93c5fd}
[data-menu="m-file"] svg{color:#60a5fa}
[data-menu="m-export"] svg{color:#fb923c}
[data-act="guide"] svg{color:#facc15}
[data-act="settings"] svg{color:#c4b5fd}
.hbtn:disabled svg{color:var(--g500)!important}
.hbtn.ico{padding:0}
.hbtn{flex:none}
.menu.right{min-width:300px}
@media (max-width:1240px){.install .lbl{display:none}.hbtn.install{padding:0 8px}}
@media (max-width:1020px){.hgroup .hbtn .lbl{display:none}}
.hbtn.install{background:var(--emerald);border-color:#10b981;color:#fff;font-weight:600}
.hbtn.install:hover{background:#10b981}
.spacer{flex:1}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:var(--g800);border:1px solid var(--g600);border-radius:8px;padding:5px;z-index:100}
.menu.right{left:auto;right:0}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;padding:6px 10px;background:none;border:0;border-radius:5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--g700)}
.menu button kbd{font:11px ui-monospace,monospace;color:var(--amber);opacity:.85}
.menu hr{border:0;border-top:1px solid var(--g700);margin:4px 2px}
.menu .mlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--g500);padding:6px 10px 2px}
.doc-name{font-weight:600;color:var(--g200);max-width:320px;display:inline-block;vertical-align:bottom;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.doc-name .dirty{color:var(--amber)}

/* ---------- Corps ---------- */
main{flex:1;display:flex;min-height:0}
aside.tools{width:144px;background:var(--g800);border-right:1px solid var(--g700);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;z-index:10;flex:none;padding:2px 0 8px}
.tsec{border-bottom:1px solid var(--g700);padding:0 8px 9px}
.tsec:last-child{border-bottom:0}
.tsec-h{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 7px;font-size:11px;font-weight:800;letter-spacing:.03em;white-space:nowrap;color:var(--g400);cursor:pointer;text-transform:uppercase}
.tsec-h:hover{color:var(--g200)}
.tsec-h svg{width:13px;height:13px;transition:transform .15s}
.tsec.collapsed .tsec-h svg{transform:rotate(-90deg)}
.tsec.collapsed .tframe{display:none}
.tsec.collapsed{padding-bottom:0}
.tframe{border:1px solid var(--g700);border-radius:9px;background:#18202c;padding:6px}
.tgrid{display:grid;grid-template-columns:repeat(3,34px);gap:6px;justify-content:center}
.tsep{grid-column:1/-1;height:1px;background:var(--g700);margin:1px 2px}
.tool-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#222c3a;border:1px solid #3a4454;border-radius:6px;cursor:pointer;color:var(--g200);padding:0}
.tool-btn:hover{background:#2c3747;border-color:#4b5563}
.tool-btn.active{background:#3b82f6;border-color:#60a5fa;color:#fff!important}
.tool-btn svg{width:19px;height:19px}
.colors{position:relative;width:96px;height:72px;margin:2px auto}
.sw{position:absolute;width:44px;height:44px;border:2px solid var(--g200);border-radius:5px;outline:1px solid #000;cursor:pointer}
#sw1{left:6px;top:4px;z-index:2}
#sw2{left:30px;top:22px;z-index:1}
#sw-swap,#sw-reset{position:absolute;background:none;border:0;cursor:pointer;color:var(--g400);padding:2px}
#sw-swap{right:0;top:0}
#sw-reset{left:0;bottom:-2px}
#sw-swap svg,#sw-reset svg{width:14px;height:14px}
#sw-swap:hover,#sw-reset:hover{color:#fff}

#stage{flex:1;position:relative;overflow:hidden;background:#2a2f38;min-width:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#textedit{position:absolute;box-shadow:none;background:rgba(255,255,255,.04);border:1px dashed #fcd34d;outline:none;resize:none;overflow:hidden;padding:0;margin:0;white-space:pre;line-height:1.2;min-width:20px;z-index:5}
#dropzone{position:absolute;inset:10px;border:3px dashed var(--amber);border-radius:12px;background:#0008;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--amber);pointer-events:none;z-index:8}

aside.panels{width:268px;background:var(--g800);border-left:1px solid var(--g700);display:flex;flex-direction:column;flex:none;min-height:0;z-index:10}
.panel{border-bottom:1px solid var(--g700);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--g850);border-bottom:1px solid var(--g700);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--g400);cursor:pointer}
.ph .chev{transition:transform .15s}
.panel.collapsed .pb{display:none}
.panel.collapsed .ph .chev{transform:rotate(-90deg)}
.pb{padding:9px 10px}
#pn-layers{flex:1}

footer{height:26px;background:var(--g800);border-top:1px solid var(--g700);display:flex;align-items:center;gap:16px;padding:0 10px;font-size:12px;color:var(--g400);flex:none}

.hg-ico{width:22px;text-align:center;font-size:15px}

.hg-list>li{padding:8px 10px;border-radius:6px;line-height:1.5}

.hg-list>li>b.t{display:block;color:#fff;margin-bottom:2px}
.hg-list kbd{font:12px ui-monospace,monospace;color:var(--amber);background:var(--g900);border:1px solid var(--g600);border-radius:3px;padding:0 4px}
.hg-hit{background:#854d0e;color:#fff;border-radius:2px;padding:0 1px}
.hg-res-ch{font-size:12px;color:var(--brand3);margin:14px 0 4px;cursor:pointer}
.hg-res-ch:hover{text-decoration:underline}
/* dialogues */
.ovl{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:500}
.dlg{background:var(--g800);border:1px solid var(--g600);border-radius:10px;min-width:340px;max-width:92vw}
.dlg h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--g700);font-size:14px;display:flex;align-items:center;gap:8px}
.dlg h3::before{content:"";width:4px;height:16px;background:var(--brand2);border-radius:2px}
.dlg .db{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg .df{padding:10px 16px;border-top:1px solid var(--g700);display:flex;justify-content:flex-end;gap:8px}
.dlg .row{display:flex;align-items:center;gap:10px}
.dlg .row>span:first-child{width:120px;color:var(--g400)}
.dlg input[type=text],.dlg input[type=number],.dlg select{background:var(--g900);border:1px solid var(--g600);border-radius:5px;padding:5px 7px;flex:1;min-width:0}
.dlg input[type=range]{flex:1;accent-color:var(--brand2)}

.btn{padding:6px 14px;border-radius:5px;border:1px solid var(--g600);background:var(--g700);cursor:pointer}
.btn:hover{background:var(--g600)}
.btn.primary{background:var(--brand);border-color:var(--brand2);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.presets{display:flex;flex-wrap:wrap;gap:5px}
.presets button{font-size:12px}
.anchor{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.anchor button{width:26px;height:26px;background:var(--g700);border:1px solid var(--g600);border-radius:3px;cursor:pointer}
.anchor button.on{background:var(--brand2)}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--g700);border:1px solid var(--g500);padding:9px 16px;border-radius:8px;z-index:600;display:flex;gap:12px;align-items:center;max-width:80vw}

@keyframes ms-up{0%{opacity:0;transform:translateY(55%)}60%{opacity:1}100%{opacity:1;transform:none}}

function layerOp(op) {

    case 'new': { pushDoc(); insertLayer(newLayer('Calque ' + (doc.layers.length + 1), doc.w, doc.h)); break; }
    case 'dup': { pushDoc(); const n = { ...l, id: uid++, name: l.name + ' copie', canvas: cloneCanvas(l.canvas) }; insertLayer(n); break; }
    case 'del': if (doc.layers.length < 2) return toast('Il faut garder au moins un calque.'); pushDoc(); doc.layers.splice(doc.active, 1); doc.active = clamp(doc.active - 1, 0, doc.layers.length - 1); break;
    case 'up': return moveLayer(doc.active, doc.active + 2);
    case 'down': if (doc.active > 0) moveLayer(doc.active, doc.active - 1); return;
    case 'merge': {
      if (doc.active === 0) return toast('Aucun calque en dessous.');

      const c = mkCanvas(doc.w, doc.h), x = c.getContext('2d');

    case 'copysel': {

      if (sel) { x.globalCompositeOperation = 'destination-in'; x.drawImage(sel.mask, 0, 0); }

}

const ADJUST = {

function dialog({ title, body, ok = 'OK', cancel = 'Annuler', alt, onOpen, wide }) {

  } });
  if (!r) return;
  const v = id => r.querySelector('#' + id);
  Object.assign(S, { backup: +v('s-backup').value, backupPrompt: v('s-bprompt').checked, history: +v('s-hist').value, confirmClose: v('s-close').checked,

}

const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function installApp() {

  if (isStandalone()) return toast('MOMO Shop est déjà installée : tu l\'utilises en ce moment en mode application.');

function buildGuide() {
  let nav = '', body = '';
  for (const [id, ico, name, subs] of GUIDE) {
    nav += `<button class="hg-tab" data-ch="${id}"><span class="hg-ico">${ico}</span>${name}</button>`;
    body += `<section class="hg-ch" data-ch="${id}"><h2 class="hg-title"><span>${ico}</span> ${name}</h2>`;
    for (const [sub, list] of subs) { if (sub) body += `<h3 class="hg-sub">${sub}</h3>`; body += `<ul class="hg-list">${list.join('')}</ul>`; }
    body += '</section>';
  }
  const g = document.createElement('div'); g.id = 'guide'; g.className = 'hidden';
  g.innerHTML = `<div class="gbox"><div class="ghead"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Guide MOMO Shop</h3>
    <div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.4-4.4"/></svg><input id="g-q" type="search" placeholder="Rechercher une fonction (ex. calque, PNG, baguette, flou…)" autocomplete="off"></div>
    <button class="gclose" title="Fermer (Échap)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="gmain"><nav>${nav}</nav><div class="gbody">${body}<div id="g-res"></div></div></div></div>`;
  document.body.appendChild(g);
  g.addEventListener('click', e => { if (e.target === g || e.target.closest('.gclose')) closeGuide(); const t = e.target.closest('.hg-tab'); if (t) guideChapter(t.dataset.ch); });
  g.addEventListener('keydown', e => { if (e.key === 'Escape') closeGuide(); e.stopPropagation(); });
  g.querySelector('#g-q').addEventListener('input', e => guideSearch(e.target.value));
}
function openGuide() { closeMenus(); const g = $('#guide'); g.classList.remove('hidden'); const q = $('#g-q'); q.value = ''; guideSearch(''); if (!$('#guide .hg-tab.on')) guideChapter('start'); setTimeout(() => q.focus(), 30); }
function closeGuide() { $('#guide').classList.add('hidden'); }
function guideChapter(id) { $$('#guide .hg-tab').forEach(b => b.classList.toggle('on', b.dataset.ch === id)); $$('#guide .hg-ch').forEach(c => c.classList.toggle('on', c.dataset.ch === id)); const q = $('#g-q'); if (q.value) { q.value = ''; guideSearch(''); } $('#guide .gbody').scrollTop = 0; }
function guideSearch(q) {
  const res = $('#g-res'); q = q.trim().toLowerCase();
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (!q) { res.innerHTML = ''; $$('#guide .hg-ch').forEach(c => c.style.display = ''); return; }
  $$('#guide .hg-ch').forEach(c => c.style.display = 'none');
  const nq = norm(q); let html = '', n = 0;
  for (const sec of $$('#guide .hg-ch')) {
    const hits = [...sec.querySelectorAll('.hg-list > li')].filter(li => norm(li.textContent).includes(nq));
    if (!hits.length) continue; n += hits.length;
    html += `<div class="hg-res-ch" data-go="${sec.dataset.ch}">${sec.querySelector('.hg-title').textContent.trim()}</div><ul class="hg-list">` + hits.map(li => '<li>' + highlight(li.innerHTML, q) + '</li>').join('') + '</ul>';
  }
  res.innerHTML = n ? `<h2 class="hg-title">🔎 ${n} résultat${n > 1 ? 's' : ''}</h2>` + html : '<div class="note" style="padding:20px 0">Aucun résultat.</div>';
  res.querySelectorAll('[data-go]').forEach(d => d.onclick = () => guideChapter(d.dataset.go));
}
function highlight(html, q) {
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt) => tag ? tag : txt.replace(re, '<span class="hg-hit">$1</span>'));
}
buildGuide();

/* ---------------- actions ---------------- */
function act(a) {
  closeMenus(); if (!doc) return;
  const [k, v] = a.split(':');
  switch (k) {
    case 'new': return newDocDialog();
    case 'open': return openFile();
    case 'save': return saveDoc();
    case 'saveas': return !v || v === 'dialog' ? saveAsDialog() : saveAs(v);
    case 'export': return saveAsDialog('png');
    case 'settings': return settingsDialog();
    case 'guide': return openGuide();
    case 'undo': return undo();
    case 'redo': return redo();
    case 'resize': return resizeDialog();
    case 'canvassize': return canvasSizeDialog();
    case 'cropsel': if (cropToSelection()) return; cropRect = null; setTool('crop'); return toast('Ajuste le cadre puis Entrée (ou Valider dans « Outil en cours »).');
    case 'trim': return trimTransparent();
    case 'rot': return rotateDoc(+v);
    case 'flipdoc': return flipDoc(v);
    case 'layer': return layerOp(v);
    case 'sel': return v === 'all' ? selectAll() : v === 'none' ? setSelection(null) : v === 'inv' ? invertSel() : selectLayerAlpha();
    case 'copy': return copySel(false);
    case 'cut': if (!editable()) return; return copySel(true);
    case 'pastehint': return toast('Utilise Ctrl+V pour coller (image du presse-papiers ou dernière copie).');
    case 'fill': return fillSelection();
    case 'clear': return clearSelectionPixels();
    case 'flt': return runFilter(v);
    case 'xf': {
      if (xf) commitTransform();
      if (v === 'free') return startTransform('affine'); if (v === 'distort') return startTransform('distort');
      if (v === 'ch' || v === 'cv') return startTransform('affine', { copy: true, flip: v === 'ch' ? 'h' : 'v' });
      const o = v === 'fh' ? { flip: 'h' } : v === 'fv' ? { flip: 'v' } : { rot: v === 'r90' ? 90 : v === 'r-90' ? -90 : 180 };
      if (startTransform('affine', o)) commitTransform(); return; }
    case 'backup': return v === 'now' ? doBackup(true) : restoreBackup();
    case 'install': return installApp();
    case 'fullscreen': return document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  }
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]');
  if (m) { const id = m.dataset.menu, menu = document.getElementById(id), was = !menu.classList.contains('hidden'); closeMenus(); if (!was) menu.classList.remove('hidden'); e.stopPropagation(); return; }
  const b = e.target.closest('[data-act]'); if (b) { act(b.dataset.act); return; }
  if (!e.target.closest('.menu')) closeMenus();
});
function closeMenus() { $$('.menu').forEach(m => m.classList.add('hidden')); }

/* ---------------- statut ---------------- */
const ZOOMS = [.05, .1, .125, .25, .333, .5, .667, .75, 1, 1.5, 2, 3, 4, 6, 8, 12, 16, 32];
function updateStatus() {
  if (!doc) return;
  $('#st-size').textContent = `${doc.w} × ${doc.h} px · ${doc.layers.length} calque${doc.layers.length > 1 ? 's' : ''}`;
  $('#st-sel').textContent = sel ? `${sel.bbox.w} × ${sel.bbox.h} px` : 'aucune';
  const z = $('#st-zoom'), pct = Math.round(cam.z * 1000) / 10;
  z.innerHTML = `<option value="fit">Ajuster</option>` + [...new Set([pct, ...ZOOMS.map(v => Math.round(v * 1000) / 10)])].sort((a, b) => a - b).map(v => `<option value="${v}"${v === pct ? ' selected' : ''}>${v} %</option>`).join('');
  if (textEdit) styleTextEdit();
}
$('#st-zoom').onchange = e => { e.target.value === 'fit' ? fit() : setZoom(+e.target.value / 100); e.target.blur(); };

/* ---------------- glisser-déposer ---------------- */
let dzCount = 0;
stage.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dzCount++; $('#dropzone').classList.remove('hidden'); } });
stage.addEventListener('dragleave', () => { if (--dzCount <= 0) { dzCount = 0; $('#dropzone').classList.add('hidden'); } });
stage.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
stage.addEventListener('drop', e => { e.preventDefault(); dzCount = 0; $('#dropzone').classList.add('hidden');
  const fs = [...e.dataTransfer.files]; const m = fs.find(isMms); if (m) return openAny(m, null); fs.filter(f => f.type.startsWith('image/')).forEach(importAsLayer); });

/* ---------------- ouverture par association de fichiers (appli installée) ---------------- */
if ('launchQueue' in window) launchQueue.setConsumer(async p => { if (!p.files || !p.files.length) return; const h = p.files[0], f = await h.getFile(); openAny(f, h); });

window.addEventListener('beforeunload', e => { if (dirty) { doBackup(false); if (S.confirmClose) { e.preventDefault(); e.returnValue = ''; } } });

/* ---------------- démarrage ---------------- */
buildTools(); renderFavs();
createDoc(S.newW, S.newH, S.newBg);
setTool(TOOL_BY_ID[localStorage.getItem('momoshop.tool')] ? localStorage.getItem('momoshop.tool') : 'brush');
window.addEventListener('pagehide', () => { try { localStorage.setItem('momoshop.tool', tool); } catch (e) {} });
setColor1('#000000');
setBackupInterval(S.backup); $('#stage').style.background = S.stageBg;
updateUndoBtns();
if (S.backupPrompt) IDB.get('backup').then(b => { if (b) { lastBackup = b.time; updateBackupInfo(); toast(`Sauvegarde auto trouvée : « ${b.name} » (${new Date(b.time).toLocaleString('fr-FR')})`, { label: 'Restaurer', fn: restoreBackup }); } }).catch(() => {});
</script>
