<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGraphisme</title>
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Grille de transparence */
        .bg-grid-pattern {
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), 
                              linear-gradient(-45deg, #333 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #333 75%), 
                              linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        /* Masquer la scrollbar pour un look plus clean (optionnel) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #525252; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #737373; }
        
        /* Utilitaires pour les panneaux latéraux */
        .panel-left-open { transform: translateX(0); margin-left: 0; }
        .panel-left-closed { transform: translateX(-100%); margin-left: -16rem; } /* 16rem = 64px * 4 = 256px (w-64) */
        
        .panel-right-open { transform: translateX(0); margin-right: 0; }
        .panel-right-closed { transform: translateX(100%); margin-right: -20rem; } /* 20rem = 80px * 4 = 320px (w-80) */
        
        @media (max-width: 768px) {
            .panel-left-closed { margin-left: 0; }
            .panel-right-closed { margin-right: 0; }
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-neutral-900 text-neutral-100 font-sans overflow-hidden">

    <!-- Fichiers inputs masqués -->
    <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" class="hidden" />
    <input type="file" id="json-input" accept=".json" class="hidden" />

    <!-- BARRE D'OUTILS SUPÉRIEURE -->
    <header class="flex items-center justify-between px-6 py-3 bg-neutral-800 border-b border-neutral-700 select-none z-20 relative shrink-0">
        <div class="flex items-center space-x-4">
            <button id="btn-toggle-left" class="text-neutral-400 hover:text-white transition-colors" title="Basculer le panneau des calques">
                <i data-lucide="panel-left-close" id="icon-panel-left"></i>
            </button>
            <div class="flex items-center space-x-2">
                <i data-lucide="layers" class="text-blue-400"></i>
                <h1 class="text-xl font-bold hidden sm:block">MOMO<span class="text-blue-500">graphisme</span></h1>
            </div>
        </div>

        <!-- Outils centraux -->
        <div class="flex bg-neutral-900 rounded-lg p-1 border border-neutral-700 items-center">
            <button id="btn-tool-pointer" class="p-1.5 rounded-md transition-colors bg-blue-600 text-white" title="Outil Sélection (V)">
                <i data-lucide="mouse-pointer-2" class="w-[18px] h-[18px]"></i>
            </button>
            <button id="btn-tool-hand" class="p-1.5 rounded-md transition-colors text-neutral-400 hover:text-white" title="Outil Main (Espace)">
                <i data-lucide="hand" class="w-[18px] h-[18px]"></i>
            </button>
            <div class="w-px h-6 bg-neutral-700 mx-1"></div>
            <button id="btn-zoom-out" class="p-1.5 text-neutral-400 hover:text-white">
                <i data-lucide="zoom-out" class="w-[18px] h-[18px]"></i>
            </button>
            <span id="zoom-level-text" class="text-xs font-mono px-2 min-w-[50px] text-center">100%</span>
            <button id="btn-zoom-in" class="p-1.5 text-neutral-400 hover:text-white">
                <i data-lucide="zoom-in" class="w-[18px] h-[18px]"></i>
            </button>
            <button id="btn-zoom-reset" class="px-2 text-xs text-blue-400 hover:underline">Centrer</button>
            <div class="w-px h-6 bg-neutral-700 mx-1"></div>
            <button id="btn-toggle-preview" class="p-1.5 text-neutral-400 hover:text-white" title="Aperçu du rendu final (Cacher ce qui dépasse)">
                <i data-lucide="eye" id="icon-preview" class="w-[18px] h-[18px]"></i>
            </button>
            <button id="btn-fullscreen" class="p-1.5 text-neutral-400 hover:text-white" title="Plein écran">
                <i data-lucide="maximize" id="icon-fullscreen" class="w-[18px] h-[18px]"></i>
            </button>
        </div>

        <div class="flex space-x-4 items-center">
            <button id="btn-load-json" class="p-1.5 text-neutral-400 hover:text-white transition-colors" title="Ouvrir projet JSON">
                <i data-lucide="upload" class="w-[18px] h-[18px]"></i>
            </button>
            <button id="btn-save-json" class="p-1.5 text-neutral-400 hover:text-white transition-colors disabled:opacity-50" title="Sauvegarder projet JSON" disabled>
                <i data-lucide="download" class="w-[18px] h-[18px]"></i>
            </button>

            <button id="btn-export-png" class="flex items-center px-4 py-1.5 text-sm bg-blue-600 hover:bg-blue-500 disabled:bg-neutral-600 rounded-md transition-colors font-semibold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i data-lucide="image-down" id="icon-export" class="w-4 h-4 mr-2"></i>
                <i data-lucide="loader-2" id="icon-exporting" class="w-4 h-4 mr-2 animate-spin hidden"></i>
                <span id="text-export">Exporter PNG</span>
            </button>

            <div class="w-px h-6 bg-neutral-700 mx-1"></div>

            <button id="btn-toggle-right" class="text-neutral-400 hover:text-white transition-colors" title="Basculer le panneau des propriétés">
                <i data-lucide="panel-right-close" id="icon-panel-right"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- PANNEAU GAUCHE : CALQUES -->
        <aside id="panel-left" class="flex-shrink-0 w-64 bg-neutral-800 border-r border-neutral-700 flex flex-col transition-all duration-300 ease-in-out absolute md:relative z-10 h-full panel-left-open">
            <div class="p-4 border-b border-neutral-700 flex justify-between items-center shrink-0">
                <h2 class="font-semibold text-neutral-300">Calques</h2>
                <button id="btn-add-layer" class="p-1.5 bg-neutral-700 hover:bg-neutral-600 rounded text-blue-400 transition-colors" title="Importer une image">
                    <i data-lucide="image" class="w-[18px] h-[18px]"></i>
                </button>
            </div>
            
            <div id="layer-list-container" class="flex-1 overflow-y-auto p-2 space-y-2">
                <!-- La liste des calques sera injectée ici par JS -->
                <p id="empty-layers-msg" class="text-center text-neutral-500 text-sm mt-4">Aucun calque.<br/>Importez une image.</p>
            </div>
        </aside>

        <!-- ESPACE CENTRAL (WORKSPACE) -->
        <main id="workspace" class="flex-1 bg-neutral-950 relative overflow-hidden outline-none cursor-default">
            <!-- Grille de fond globale -->
            <div class="absolute inset-0 z-0 opacity-20 pointer-events-none bg-grid-pattern"></div>
            
            <!-- Conteneur Artboard dynamique (Gère le Pan et le Zoom) -->
            <div id="artboard-container" class="absolute left-1/2 top-1/2 transition-transform duration-75 ease-out shadow-2xl ring-1 ring-neutral-500 bg-transparent overflow-visible" style="width: 794px; height: 1123px; transform: translate(-50%, -50%) scale(1); transform-origin: center center;">
                <!-- Conteneur des images/calques -->
                <div id="artboard-layers" class="relative w-full h-full overflow-visible">
                    <!-- Les images seront injectées ici par JS -->
                </div>
                <!-- Masque d'assombrissement pour l'extérieur de la zone de travail -->
                <div id="artboard-mask" class="absolute inset-0 pointer-events-none z-[100] shadow-[0_0_0_9999px_rgba(23,23,23,0.75)]"></div>
            </div>
            
            <!-- Instructions discrètes -->
            <div class="absolute bottom-4 left-4 text-xs text-neutral-500 font-mono pointer-events-none bg-neutral-900/50 p-2 rounded z-20">
                Maintenez ESPACE pour vous déplacer
            </div>
        </main>

        <!-- PANNEAU DROITE : PROPRIÉTÉS -->
        <aside id="panel-right" class="flex-shrink-0 w-80 bg-neutral-800 border-l border-neutral-700 flex flex-col overflow-y-auto transition-all duration-300 ease-in-out absolute right-0 md:relative z-10 h-full panel-right-open">
            <div class="p-4 border-b border-neutral-700 flex items-center space-x-2 shrink-0">
                <i data-lucide="settings" class="w-[18px] h-[18px] text-neutral-400"></i>
                <h2 class="font-semibold text-neutral-300">Propriétés</h2>
            </div>
            
            <!-- Propriétés du Document (affichées si aucun calque n'est sélectionné) -->
            <div id="prop-document" class="p-5 space-y-6">
                <div class="space-y-1">
                    <p class="text-xs text-neutral-400 uppercase tracking-wider font-semibold">Document</p>
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-medium">Zone de travail</p>
                        <div class="flex items-center bg-neutral-900 rounded border border-neutral-700 p-0.5">
                            <button id="btn-unit-px" class="px-2 py-0.5 text-xs rounded transition-colors text-neutral-400 hover:text-white">px</button>
                            <button id="btn-unit-cm" class="px-2 py-0.5 text-xs rounded transition-colors bg-neutral-700 text-white shadow-sm">cm</button>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label id="label-doc-width" class="text-xs">Largeur (cm)</label>
                        <input type="number" id="input-doc-width" value="21" step="0.1" class="w-full bg-neutral-900 border border-neutral-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500" />
                    </div>
                    <div class="space-y-1">
                        <label id="label-doc-height" class="text-xs">Hauteur (cm)</label>
                        <input type="number" id="input-doc-height" value="29.7" step="0.1" class="w-full bg-neutral-900 border border-neutral-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500" />
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-xs">Couleur de fond</label>
                    <div class="flex items-center space-x-3 mt-1">
                        <input type="color" id="input-doc-bg" value="#ffffff" class="w-8 h-8 bg-transparent cursor-pointer rounded border border-neutral-700" disabled />
                        <label class="flex items-center space-x-2 text-xs cursor-pointer">
                            <input type="checkbox" id="input-doc-transparent" checked class="rounded border-neutral-700 text-blue-500 focus:ring-blue-500 bg-neutral-900 accent-blue-500" />
                            <span>Fond transparent</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Formulaire de propriétés (masqué si aucun calque sélectionné) -->
            <div id="prop-form" class="p-5 space-y-6 hidden">
                <!-- Infos -->
                <div class="space-y-1">
                    <p class="text-xs text-neutral-400 uppercase tracking-wider font-semibold">Calque sélectionné</p>
                    <p id="prop-layer-name" class="text-sm font-medium truncate">Nom du calque</p>
                </div>

                <!-- Transformation Accordion -->
                <div class="border-b border-neutral-700 pb-4">
                    <button class="toggle-accordion w-full flex justify-between items-center text-sm text-neutral-300 hover:text-white transition-colors group" data-target="grp-transform">
                        <span class="flex items-center space-x-2 font-semibold">
                            <span class="text-base">✨</span>
                            <span>Transformation</span>
                        </span>
                        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 transform"></i>
                    </button>
                    <div id="grp-transform" class="space-y-4 pt-4">
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Opacité (Transparence)</label><span id="val-opacity">100%</span></div>
                            <input type="range" id="input-opacity" min="0" max="1" step="0.01" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Échelle</label><span id="val-scale">1.00x</span></div>
                            <input type="range" id="input-scale" min="0.1" max="5" step="0.05" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Rotation</label><span id="val-rotation">0°</span></div>
                            <input type="range" id="input-rotation" min="-180" max="180" step="1" class="w-full accent-blue-500" />
                        </div>
                    </div>
                </div>

                <!-- Rognage Accordion -->
                <div class="border-b border-neutral-700 pb-4">
                    <button class="toggle-accordion w-full flex justify-between items-center text-sm text-neutral-300 hover:text-white transition-colors group" data-target="grp-crop">
                        <span class="flex items-center space-x-2 font-semibold">
                            <span class="text-base">✂️</span>
                            <span>Rognage</span>
                        </span>
                        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 transform"></i>
                    </button>
                    <div id="grp-crop" class="space-y-4 pt-4">
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Haut</label><span id="val-cropTop">0%</span></div>
                            <input type="range" id="input-cropTop" min="0" max="100" step="1" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Bas</label><span id="val-cropBottom">0%</span></div>
                            <input type="range" id="input-cropBottom" min="0" max="100" step="1" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Gauche</label><span id="val-cropLeft">0%</span></div>
                            <input type="range" id="input-cropLeft" min="0" max="100" step="1" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Droite</label><span id="val-cropRight">0%</span></div>
                            <input type="range" id="input-cropRight" min="0" max="100" step="1" class="w-full accent-blue-500" />
                        </div>
                    </div>
                </div>

                <!-- Filtres Accordion -->
                <div class="border-b border-neutral-700 pb-4">
                    <button class="toggle-accordion w-full flex justify-between items-center text-sm text-neutral-300 hover:text-white transition-colors group" data-target="grp-filter">
                        <span class="flex items-center space-x-2 font-semibold">
                            <span class="text-base">📚</span>
                            <span>Filtres</span>
                        </span>
                        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 transform"></i>
                    </button>
                    <div id="grp-filter" class="space-y-4 pt-4">
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Luminosité</label><span id="val-brightness">100%</span></div>
                            <input type="range" id="input-brightness" min="0" max="200" step="1" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Contraste</label><span id="val-contrast">100%</span></div>
                            <input type="range" id="input-contrast" min="0" max="200" step="1" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Saturation</label><span id="val-saturation">100%</span></div>
                            <input type="range" id="input-saturation" min="0" max="200" step="1" class="w-full accent-blue-500" />
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Flou Gaussien</label><span id="val-blur">0px</span></div>
                            <input type="range" id="input-blur" min="0" max="50" step="1" class="w-full accent-blue-500" />
                        </div>
                    </div>
                </div>

                <!-- Ombre Portée Accordion -->
                <div class="pb-4">
                    <button class="toggle-accordion w-full flex justify-between items-center text-sm text-neutral-300 hover:text-white transition-colors group" data-target="grp-shadow">
                        <span class="flex items-center space-x-2 font-semibold">
                            <span class="text-base">👤</span>
                            <span>Ombre Portée</span>
                        </span>
                        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 transform"></i>
                    </button>
                    <div id="grp-shadow" class="space-y-4 pt-4">
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><label>Opacité</label><span id="val-shadowOpacity">0%</span></div>
                            <input type="range" id="input-shadowOpacity" min="0" max="1" step="0.05" class="w-full accent-blue-500" />
                        </div>

                        <div id="prop-shadow-details" class="hidden">
                            <div class="grid grid-cols-1 gap-4">
                                <div class="space-y-2">
                                    <div class="flex justify-between text-xs"><label>Angle</label><span id="val-shadowAngle">45°</span></div>
                                    <input type="range" id="input-shadowAngle" min="0" max="360" step="1" class="w-full accent-blue-500" />
                                </div>
                                <div class="space-y-2">
                                    <div class="flex justify-between text-xs"><label>Distance</label><span id="val-shadowDistance">0px</span></div>
                                    <input type="range" id="input-shadowDistance" min="0" max="100" step="1" class="w-full accent-blue-500" />
                                </div>
                            </div>
                            <div class="space-y-2 mt-4">
                                <div class="flex justify-between text-xs"><label>Étalement (Blur)</label><span id="val-shadowBlur">0px</span></div>
                                <input type="range" id="input-shadowBlur" min="0" max="100" step="1" class="w-full accent-blue-500" />
                            </div>
                            <div class="space-y-1 mt-4">
                                <label class="text-xs">Couleur</label>
                                <input type="color" id="input-shadowColor" class="w-full h-8 bg-transparent cursor-pointer rounded border border-neutral-700" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        // --- CONSTANTES ET ETAT GLOBAL ---
        const CM_TO_PX = 96 / 2.54;
        const PX_TO_CM = 2.54 / 96;

        let state = {
            artboard: {
                width: 794, // 21cm à 96dpi
                height: 1123, // 29.7cm à 96dpi
                isTransparent: true,
                bgColor: '#ffffff'
            },
            ui: {
                unit: 'cm', // 'px' ou 'cm'
                previewMode: false
            },
            layers: [],
            selectedLayerId: null,
            showLeftPanel: true,
            showRightPanel: true,
            zoom: 1,
            pan: { x: 0, y: 0 },
            activeTool: 'pointer', // 'pointer' ou 'hand'
            isSpacePressed: false,
            interaction: {
                type: 'none', // 'none' | 'dragging_layer' | 'panning_workspace'
                startX: 0,
                startY: 0,
                initialLayerX: 0,
                initialLayerY: 0,
                initialPanX: 0,
                initialPanY: 0
            }
        };

        // --- ELEMENTS DU DOM ---
        const DOM = {
            workspace: document.getElementById('workspace'),
            artboardContainer: document.getElementById('artboard-container'),
            artboardLayers: document.getElementById('artboard-layers'),
            artboardMask: document.getElementById('artboard-mask'),
            layerListContainer: document.getElementById('layer-list-container'),
            emptyLayersMsg: document.getElementById('empty-layers-msg'),
            fileInput: document.getElementById('file-input'),
            jsonInput: document.getElementById('json-input'),
            
            // Panneaux
            panelLeft: document.getElementById('panel-left'),
            panelRight: document.getElementById('panel-right'),
            
            // Outils & Boutons
            btnToggleLeft: document.getElementById('btn-toggle-left'),
            btnToggleRight: document.getElementById('btn-toggle-right'),
            btnToolPointer: document.getElementById('btn-tool-pointer'),
            btnToolHand: document.getElementById('btn-tool-hand'),
            btnZoomIn: document.getElementById('btn-zoom-in'),
            btnZoomOut: document.getElementById('btn-zoom-out'),
            btnZoomReset: document.getElementById('btn-zoom-reset'),
            btnTogglePreview: document.getElementById('btn-toggle-preview'),
            iconPreview: document.getElementById('icon-preview'),
            btnFullscreen: document.getElementById('btn-fullscreen'),
            iconFullscreen: document.getElementById('icon-fullscreen'),
            zoomLevelText: document.getElementById('zoom-level-text'),
            btnAddLayer: document.getElementById('btn-add-layer'),
            btnLoadJson: document.getElementById('btn-load-json'),
            btnSaveJson: document.getElementById('btn-save-json'),
            btnExportPng: document.getElementById('btn-export-png'),
            
            // Propriétés Document
            propDocument: document.getElementById('prop-document'),
            btnUnitPx: document.getElementById('btn-unit-px'),
            btnUnitCm: document.getElementById('btn-unit-cm'),
            labelDocWidth: document.getElementById('label-doc-width'),
            labelDocHeight: document.getElementById('label-doc-height'),
            inputDocWidth: document.getElementById('input-doc-width'),
            inputDocHeight: document.getElementById('input-doc-height'),
            inputDocBg: document.getElementById('input-doc-bg'),
            inputDocTransparent: document.getElementById('input-doc-transparent'),

            // Propriétés calque
            propForm: document.getElementById('prop-form'),
            propLayerName: document.getElementById('prop-layer-name'),
            propShadowDetails: document.getElementById('prop-shadow-details'),
            inputs: {
                opacity: document.getElementById('input-opacity'),
                scale: document.getElementById('input-scale'),
                rotation: document.getElementById('input-rotation'),
                cropTop: document.getElementById('input-cropTop'),
                cropBottom: document.getElementById('input-cropBottom'),
                cropLeft: document.getElementById('input-cropLeft'),
                cropRight: document.getElementById('input-cropRight'),
                brightness: document.getElementById('input-brightness'),
                contrast: document.getElementById('input-contrast'),
                saturation: document.getElementById('input-saturation'),
                blur: document.getElementById('input-blur'),
                shadowOpacity: document.getElementById('input-shadowOpacity'),
                shadowAngle: document.getElementById('input-shadowAngle'),
                shadowDistance: document.getElementById('input-shadowDistance'),
                shadowBlur: document.getElementById('input-shadowBlur'),
                shadowColor: document.getElementById('input-shadowColor'),
            },
            vals: {
                opacity: document.getElementById('val-opacity'),
                scale: document.getElementById('val-scale'),
                rotation: document.getElementById('val-rotation'),
                cropTop: document.getElementById('val-cropTop'),
                cropBottom: document.getElementById('val-cropBottom'),
                cropLeft: document.getElementById('val-cropLeft'),
                cropRight: document.getElementById('val-cropRight'),
                brightness: document.getElementById('val-brightness'),
                contrast: document.getElementById('val-contrast'),
                saturation: document.getElementById('val-saturation'),
                blur: document.getElementById('val-blur'),
                shadowOpacity: document.getElementById('val-shadowOpacity'),
                shadowAngle: document.getElementById('val-shadowAngle'),
                shadowDistance: document.getElementById('val-shadowDistance'),
                shadowBlur: document.getElementById('val-shadowBlur'),
            }
        };

        // --- FONCTIONS UTILITAIRES ---
        const generateId = () => `layer_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        
        const getSelectedLayer = () => state.layers.find(l => l.id === state.selectedLayerId);
        
        const updateLayerData = (id, updates) => {
            state.layers = state.layers.map(layer => layer.id === id ? { ...layer, ...updates } : layer);
            renderWorkspace(); // Mise à jour visuelle du canevas
            
            // Si on modifie depuis l'interface, on met à jour les labels sans reconstruire tout le formulaire
            if (id === state.selectedLayerId) {
                updatePropertyLabels();
            }
        };

        const deleteLayer = (id) => {
            state.layers = state.layers.filter(layer => layer.id !== id);
            if (state.selectedLayerId === id) {
                state.selectedLayerId = null;
                populatePropertiesPanel();
            }
            renderLayerList();
            renderWorkspace();
            updateToolbarState();
        };

        // --- RENDU (VIEWS) ---

        // Met à jour la liste des calques à gauche
        function renderLayerList() {
            DOM.emptyLayersMsg.style.display = state.layers.length === 0 ? 'block' : 'none';
            
            // Supprimer les calques actuels sauf le message vide
            const items = DOM.layerListContainer.querySelectorAll('.layer-item');
            items.forEach(item => item.remove());

            state.layers.forEach((layer, index) => {
                const isSelected = state.selectedLayerId === layer.id;
                
                const div = document.createElement('div');
                div.className = `layer-item flex items-center justify-between p-2 rounded cursor-grab active:cursor-grabbing transition-colors mb-2 ${isSelected ? 'bg-blue-900/50 border border-blue-500/50' : 'bg-neutral-700/50 hover:bg-neutral-700'}`;
                div.draggable = true;
                div.dataset.index = index;
                div.dataset.id = layer.id;

                div.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden pointer-events-none">
                        <div class="w-8 h-8 bg-neutral-900 rounded overflow-hidden flex-shrink-0 border border-neutral-600 flex items-center justify-center relative">
                            <div class="absolute inset-0 opacity-20 bg-grid-pattern" style="background-size: 8px 8px;"></div>
                            <img src="${layer.src}" class="max-w-full max-h-full object-contain relative z-10" />
                        </div>
                        <span class="text-sm truncate max-w-[100px]">${layer.name}</span>
                    </div>
                    <button class="btn-delete-layer text-neutral-500 hover:text-red-400 p-1" data-id="${layer.id}">
                        <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i>
                    </button>
                `;

                // Événements pour la sélection
                div.addEventListener('click', () => {
                    state.selectedLayerId = layer.id;
                    renderLayerList();
                    renderWorkspace();
                    populatePropertiesPanel();
                });

                // Événements de Drag & Drop pour la réorganisation
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('layerIndex', index);
                });
                div.addEventListener('dragover', (e) => e.preventDefault());
                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const dragIndex = parseInt(e.dataTransfer.getData('layerIndex'), 10);
                    const dropIndex = index;
                    if (dragIndex === dropIndex) return;
                    
                    const newLayers = [...state.layers];
                    const [draggedLayer] = newLayers.splice(dragIndex, 1);
                    newLayers.splice(dropIndex, 0, draggedLayer);
                    state.layers = newLayers;
                    
                    renderLayerList();
                    renderWorkspace();
                });

                DOM.layerListContainer.appendChild(div);
            });
            lucide.createIcons();
        }

        // Met à jour la position de la zone de travail
        function updateWorkspaceTransform() {
            DOM.artboardContainer.style.width = `${state.artboard.width}px`;
            DOM.artboardContainer.style.height = `${state.artboard.height}px`;
            DOM.artboardContainer.style.backgroundColor = state.artboard.isTransparent ? 'transparent' : state.artboard.bgColor;
            DOM.artboardContainer.style.transform = `translate(calc(-50% + ${state.pan.x}px), calc(-50% + ${state.pan.y}px)) scale(${state.zoom})`;
            DOM.zoomLevelText.textContent = `${Math.round(state.zoom * 100)}%`;
        }

        // Met à jour le curseur global
        function updateCursor() {
            const isHandMode = state.activeTool === 'hand' || state.isSpacePressed;
            if (isHandMode) {
                DOM.workspace.style.cursor = state.interaction.type === 'panning_workspace' ? 'grabbing' : 'grab';
            } else {
                DOM.workspace.style.cursor = 'default';
            }
        }

        // Met à jour les calques sur le canevas
        function renderWorkspace() {
            updateWorkspaceTransform();
            updateCursor();

            DOM.artboardLayers.innerHTML = ''; // Clear

            const isHandMode = state.activeTool === 'hand' || state.isSpacePressed;

            state.layers.forEach((layer, index) => {
                const actualZIndex = state.layers.length - index;
                const isSelected = state.selectedLayerId === layer.id;

                // Calculs ombres
                const angleRad = (layer.shadowAngle || 45) * (Math.PI / 180);
                const sX = Math.round(Math.cos(angleRad) * (layer.shadowDistance || 0));
                const sY = Math.round(Math.sin(angleRad) * (layer.shadowDistance || 0));

                let shadowRgb = [0,0,0];
                if (layer.shadowColor) {
                    const match = layer.shadowColor.match(/\w\w/g);
                    if(match) shadowRgb = match.map(x => parseInt(x, 16));
                }

                const dropShadowFilter = layer.shadowOpacity > 0 
                  ? `drop-shadow(${sX}px ${sY}px ${layer.shadowBlur}px rgba(${shadowRgb[0]},${shadowRgb[1]},${shadowRgb[2]},${layer.shadowOpacity}))` 
                  : '';

                // Application des filtres et du masque de rognage
                const filterStr = `brightness(${layer.brightness ?? 100}%) contrast(${layer.contrast ?? 100}%) saturate(${layer.saturation ?? 100}%) blur(${layer.blur ?? 0}px) ${dropShadowFilter}`;
                const layerOpacity = layer.opacity ?? 1;
                
                const crop = layer.crop || { top: 0, bottom: 0, left: 0, right: 0 };
                const clipPathStr = `inset(${crop.top}% ${crop.right}% ${crop.bottom}% ${crop.left}%)`;

                const div = document.createElement('div');
                div.className = `absolute transition-shadow rounded-sm ${isSelected ? 'ring-2 ring-blue-500 ring-offset-2 ring-offset-transparent outline-none' : ''}`;
                div.style.left = `${layer.x}px`;
                div.style.top = `${layer.y}px`;
                div.style.transform = `translate(-50%, -50%) scale(${layer.scale}) rotate(${layer.rotation}deg)`;
                div.style.transformOrigin = 'center center';
                div.style.zIndex = actualZIndex;
                
                if (isHandMode) {
                    div.style.cursor = 'inherit';
                } else {
                    div.style.cursor = (state.interaction.type === 'dragging_layer' && isSelected) ? 'grabbing' : 'pointer';
                }

                div.innerHTML = `<img src="${layer.src}" draggable="false" class="max-w-none pointer-events-none block" style="filter: ${filterStr}; opacity: ${layerOpacity}; clip-path: ${clipPathStr};" />`;

                // Ajout des points d'accroche (poignées de redimensionnement) si sélectionné
                if (isSelected && !isHandMode) {
                    const handlePositions = [
                        'top-0 left-0 -mt-1.5 -ml-1.5',   // Haut Gauche
                        'top-0 right-0 -mt-1.5 -mr-1.5',  // Haut Droite
                        'bottom-0 left-0 -mb-1.5 -ml-1.5',// Bas Gauche
                        'bottom-0 right-0 -mb-1.5 -mr-1.5'// Bas Droite
                    ];
                    
                    handlePositions.forEach(posClass => {
                        const handle = document.createElement('div');
                        handle.className = `absolute w-3 h-3 bg-white border border-blue-600 rounded-full z-20 cursor-pointer shadow-sm ${posClass}`;
                        // On annule visuellement le scale du parent pour que la poignée garde la même taille à l'écran
                        handle.style.transform = `scale(${1 / layer.scale})`;
                        
                        handle.addEventListener('mousedown', (e) => {
                            e.stopPropagation(); // Empêche de déclencher le drag du calque
                            
                            // Calcul du centre absolu de l'image sur l'écran (en tenant compte du zoom de l'artboard)
                            const rect = DOM.artboardContainer.getBoundingClientRect();
                            const layerAbsCenterX = rect.left + (layer.x * state.zoom);
                            const layerAbsCenterY = rect.top + (layer.y * state.zoom);
                            
                            state.interaction = {
                                type: 'resizing_layer',
                                initialScale: layer.scale,
                                centerX: layerAbsCenterX,
                                centerY: layerAbsCenterY,
                                // Distance initiale entre la souris et le centre de l'image
                                startDist: Math.hypot(e.clientX - layerAbsCenterX, e.clientY - layerAbsCenterY)
                            };
                        });
                        div.appendChild(handle);
                    });
                }

                // Event pour attraper le calque
                div.addEventListener('mousedown', (e) => {
                    if (state.activeTool === 'hand' || state.isSpacePressed) return;
                    e.stopPropagation();
                    state.selectedLayerId = layer.id;
                    state.interaction = {
                        type: 'dragging_layer',
                        startX: e.clientX,
                        startY: e.clientY,
                        initialLayerX: layer.x,
                        initialLayerY: layer.y
                    };
                    renderLayerList();
                    populatePropertiesPanel();
                    renderWorkspace(); // pour updateCursor
                });

                DOM.artboardLayers.appendChild(div);
            });
        }

        // Remplit le panneau de propriétés de droite lors d'un clic
        function populatePropertiesPanel() {
            const layer = getSelectedLayer();
            if (!layer) {
                DOM.propDocument.style.display = 'block';
                DOM.propForm.style.display = 'none';
                
                // Maj des inputs document
                if (state.ui.unit === 'cm') {
                    DOM.inputDocWidth.value = parseFloat((state.artboard.width * PX_TO_CM).toFixed(2));
                    DOM.inputDocHeight.value = parseFloat((state.artboard.height * PX_TO_CM).toFixed(2));
                    DOM.inputDocWidth.step = "0.1";
                    DOM.inputDocHeight.step = "0.1";
                    DOM.labelDocWidth.textContent = "Largeur (cm)";
                    DOM.labelDocHeight.textContent = "Hauteur (cm)";
                    DOM.btnUnitCm.classList.replace('text-neutral-400', 'text-white');
                    DOM.btnUnitCm.classList.add('bg-neutral-700', 'shadow-sm');
                    DOM.btnUnitPx.classList.replace('text-white', 'text-neutral-400');
                    DOM.btnUnitPx.classList.remove('bg-neutral-700', 'shadow-sm');
                } else {
                    DOM.inputDocWidth.value = Math.round(state.artboard.width);
                    DOM.inputDocHeight.value = Math.round(state.artboard.height);
                    DOM.inputDocWidth.step = "1";
                    DOM.inputDocHeight.step = "1";
                    DOM.labelDocWidth.textContent = "Largeur (px)";
                    DOM.labelDocHeight.textContent = "Hauteur (px)";
                    DOM.btnUnitPx.classList.replace('text-neutral-400', 'text-white');
                    DOM.btnUnitPx.classList.add('bg-neutral-700', 'shadow-sm');
                    DOM.btnUnitCm.classList.replace('text-white', 'text-neutral-400');
                    DOM.btnUnitCm.classList.remove('bg-neutral-700', 'shadow-sm');
                }
                
                DOM.inputDocBg.value = state.artboard.bgColor;
                DOM.inputDocTransparent.checked = state.artboard.isTransparent;
                DOM.inputDocBg.disabled = state.artboard.isTransparent;
                
                return;
            }

            DOM.propDocument.style.display = 'none';
            DOM.propForm.style.display = 'block';

            DOM.propLayerName.textContent = layer.name;

            // Set input values
            DOM.inputs.opacity.value = layer.opacity ?? 1;
            DOM.inputs.scale.value = layer.scale;
            DOM.inputs.rotation.value = layer.rotation;
            
            const crop = layer.crop || { top: 0, bottom: 0, left: 0, right: 0 };
            DOM.inputs.cropTop.value = crop.top;
            DOM.inputs.cropBottom.value = crop.bottom;
            DOM.inputs.cropLeft.value = crop.left;
            DOM.inputs.cropRight.value = crop.right;

            DOM.inputs.brightness.value = layer.brightness ?? 100;
            DOM.inputs.contrast.value = layer.contrast ?? 100;
            DOM.inputs.saturation.value = layer.saturation ?? 100;
            DOM.inputs.blur.value = layer.blur ?? 0;
            DOM.inputs.shadowOpacity.value = layer.shadowOpacity;
            DOM.inputs.shadowAngle.value = layer.shadowAngle;
            DOM.inputs.shadowDistance.value = layer.shadowDistance;
            DOM.inputs.shadowBlur.value = layer.shadowBlur;
            DOM.inputs.shadowColor.value = layer.shadowColor;

            updatePropertyLabels();
        }

        // Met à jour juste les textes à côté des sliders
        function updatePropertyLabels() {
            const layer = getSelectedLayer();
            if(!layer) return;

            DOM.vals.opacity.textContent = `${Math.round((layer.opacity ?? 1) * 100)}%`;
            DOM.vals.scale.textContent = `${parseFloat(layer.scale).toFixed(2)}x`;
            DOM.vals.rotation.textContent = `${layer.rotation}°`;
            
            const crop = layer.crop || { top: 0, bottom: 0, left: 0, right: 0 };
            DOM.vals.cropTop.textContent = `${crop.top}%`;
            DOM.vals.cropBottom.textContent = `${crop.bottom}%`;
            DOM.vals.cropLeft.textContent = `${crop.left}%`;
            DOM.vals.cropRight.textContent = `${crop.right}%`;

            DOM.vals.brightness.textContent = `${layer.brightness ?? 100}%`;
            DOM.vals.contrast.textContent = `${layer.contrast ?? 100}%`;
            DOM.vals.saturation.textContent = `${layer.saturation ?? 100}%`;
            DOM.vals.blur.textContent = `${layer.blur ?? 0}px`;
            DOM.vals.shadowOpacity.textContent = `${Math.round(layer.shadowOpacity * 100)}%`;
            DOM.vals.shadowAngle.textContent = `${layer.shadowAngle}°`;
            DOM.vals.shadowDistance.textContent = `${layer.shadowDistance}px`;
            DOM.vals.shadowBlur.textContent = `${layer.shadowBlur}px`;

            // Afficher/masquer les options d'ombre
            DOM.propShadowDetails.style.display = layer.shadowOpacity > 0 ? 'block' : 'none';
        }

        // Mise à jour de l'état des boutons (désactivés si vide)
        function updateToolbarState() {
            const hasLayers = state.layers.length > 0;
            DOM.btnSaveJson.disabled = !hasLayers;
            DOM.btnExportPng.disabled = !hasLayers;
        }

        function toggleTool(tool) {
            state.activeTool = tool;
            
            if(tool === 'pointer') {
                DOM.btnToolPointer.classList.replace('text-neutral-400', 'bg-blue-600');
                DOM.btnToolPointer.classList.replace('hover:text-white', 'text-white');
                DOM.btnToolHand.classList.replace('bg-blue-600', 'text-neutral-400');
                DOM.btnToolHand.classList.replace('text-white', 'hover:text-white');
            } else {
                DOM.btnToolHand.classList.replace('text-neutral-400', 'bg-blue-600');
                DOM.btnToolHand.classList.replace('hover:text-white', 'text-white');
                DOM.btnToolPointer.classList.replace('bg-blue-600', 'text-neutral-400');
                DOM.btnToolPointer.classList.replace('text-white', 'hover:text-white');
            }
            renderWorkspace();
        }

        // --- GESTION DES EVENEMENTS ---

        function setupEventListeners() {
            // Import d'image
            DOM.btnAddLayer.addEventListener('click', () => DOM.fileInput.click());
            DOM.fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const newLayer = {
                        id: generateId(),
                        name: file.name,
                        src: event.target.result,
                        x: state.artboard.width / 2,
                        y: state.artboard.height / 2,
                        opacity: 1, scale: 1, rotation: 0, brightness: 100, contrast: 100, saturation: 100, blur: 0,
                        crop: { top: 0, bottom: 0, left: 0, right: 0 },
                        shadowAngle: 45, shadowDistance: 0, shadowBlur: 0, shadowColor: '#000000', shadowOpacity: 0
                    };
                    state.layers.unshift(newLayer); // Ajouter en haut
                    state.selectedLayerId = newLayer.id;
                    toggleTool('pointer');
                    
                    renderLayerList();
                    renderWorkspace();
                    populatePropertiesPanel();
                    updateToolbarState();
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            });

            // Sauvegarde & Chargement JSON
            DOM.btnLoadJson.addEventListener('click', () => DOM.jsonInput.click());
            DOM.jsonInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const loadedData = JSON.parse(event.target.result);
                        
                        // Rétrocompatibilité avec les anciennes sauvegardes
                        if (Array.isArray(loadedData)) {
                            state.layers = loadedData;
                        } else if (loadedData.layers) {
                            state.layers = loadedData.layers;
                            if (loadedData.artboard) state.artboard = loadedData.artboard;
                        }

                        state.selectedLayerId = state.layers.length > 0 ? state.layers[0].id : null;
                        state.pan = { x: 0, y: 0 };
                        state.zoom = 1;
                        renderLayerList();
                        renderWorkspace();
                        populatePropertiesPanel();
                        updateToolbarState();
                    } catch (err) { alert("Fichier JSON invalide."); }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            DOM.btnSaveJson.addEventListener('click', () => {
                const dataToSave = {
                    artboard: state.artboard,
                    layers: state.layers
                };
                const dataStr = JSON.stringify(dataToSave, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `projet_${new Date().toISOString().slice(0,10)}.json`;
                link.click();
                URL.revokeObjectURL(url);
            });

            // Export PNG
            DOM.btnExportPng.addEventListener('click', async () => {
                if(state.layers.length === 0) return;
                
                // UI Loader
                DOM.btnExportPng.disabled = true;
                document.getElementById('icon-export').classList.add('hidden');
                document.getElementById('icon-exporting').classList.remove('hidden');
                document.getElementById('text-export').textContent = "Calcul...";

                // Petit délai pour affichage du loader
                await new Promise(r => setTimeout(r, 100));

                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = state.artboard.width;
                    canvas.height = state.artboard.height;
                    const ctx = canvas.getContext('2d');

                    if (!state.artboard.isTransparent) {
                        ctx.fillStyle = state.artboard.bgColor;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }

                    const reversedLayers = [...state.layers].reverse();

                    for (const layer of reversedLayers) {
                        const img = new Image();
                        img.src = layer.src;
                        await new Promise(resolve => { img.onload = resolve; });

                        ctx.save();
                        ctx.translate(layer.x, layer.y);
                        ctx.rotate(layer.rotation * (Math.PI / 180));
                        ctx.scale(layer.scale, layer.scale);

                        const angleRad = (layer.shadowAngle || 45) * (Math.PI / 180);
                        const sX = Math.round(Math.cos(angleRad) * (layer.shadowDistance || 0));
                        const sY = Math.round(Math.sin(angleRad) * (layer.shadowDistance || 0));

                        let filterStr = `brightness(${layer.brightness ?? 100}%) contrast(${layer.contrast ?? 100}%) saturate(${layer.saturation ?? 100}%) blur(${layer.blur ?? 0}px)`;
                        if (layer.shadowOpacity > 0) {
                            let shadowHex = layer.shadowColor || '#000000';
                            let shadowRgb = shadowHex.match(/\w\w/g)?.map(x => parseInt(x, 16)) || [0,0,0];
                            filterStr += ` drop-shadow(${sX}px ${sY}px ${layer.shadowBlur}px rgba(${shadowRgb[0]},${shadowRgb[1]},${shadowRgb[2]},${layer.shadowOpacity}))`;
                        }
                        ctx.filter = filterStr;
                        ctx.globalAlpha = layer.opacity ?? 1;

                        // Application du masque de rognage pour l'exportation
                        const crop = layer.crop || { top: 0, bottom: 0, left: 0, right: 0 };
                        if (crop.top > 0 || crop.bottom > 0 || crop.left > 0 || crop.right > 0) {
                            ctx.beginPath();
                            const clipX = -img.width / 2 + (img.width * (crop.left / 100));
                            const clipY = -img.height / 2 + (img.height * (crop.top / 100));
                            const clipW = img.width * (1 - (crop.left + crop.right) / 100);
                            const clipH = img.height * (1 - (crop.top + crop.bottom) / 100);
                            ctx.rect(clipX, clipY, clipW, clipH);
                            ctx.clip();
                        }

                        ctx.drawImage(img, -img.width / 2, -img.height / 2);
                        ctx.globalAlpha = 1; // Restaurer l'opacité par défaut pour le prochain dessin
                        ctx.restore();
                    }

                    const dataUrl = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `export_${new Date().toISOString().slice(0,10)}.png`;
                    link.href = dataUrl;
                    link.click();
                } catch (e) {
                    console.error(e);
                    alert("Erreur lors de l'exportation.");
                } finally {
                    DOM.btnExportPng.disabled = false;
                    document.getElementById('icon-export').classList.remove('hidden');
                    document.getElementById('icon-exporting').classList.add('hidden');
                    document.getElementById('text-export').textContent = "Exporter PNG";
                }
            });

            // Supprimer un calque (event delegation)
            DOM.layerListContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-delete-layer');
                if (btn) {
                    e.stopPropagation();
                    deleteLayer(btn.dataset.id);
                }
            });

            // Clic sur l'espace vide pour désélectionner
            DOM.workspace.addEventListener('mousedown', (e) => {
                const isHandMode = state.activeTool === 'hand' || state.isSpacePressed;
                
                if (isHandMode) {
                    state.interaction = {
                        type: 'panning_workspace',
                        startX: e.clientX,
                        startY: e.clientY,
                        initialPanX: state.pan.x,
                        initialPanY: state.pan.y
                    };
                    renderWorkspace(); // Update cursor
                } else if (e.target === DOM.workspace || e.target.classList.contains('bg-grid-pattern')) {
                    state.selectedLayerId = null;
                    renderLayerList();
                    populatePropertiesPanel();
                    renderWorkspace();
                }
            });

            // Drag global
            window.addEventListener('mousemove', (e) => {
                if (state.interaction.type === 'none') return;

                const dx = e.clientX - state.interaction.startX;
                const dy = e.clientY - state.interaction.startY;

                if (state.interaction.type === 'panning_workspace') {
                    state.pan.x = state.interaction.initialPanX + dx;
                    state.pan.y = state.interaction.initialPanY + dy;
                    updateWorkspaceTransform();
                } else if (state.interaction.type === 'dragging_layer' && state.selectedLayerId) {
                    updateLayerData(state.selectedLayerId, {
                        x: state.interaction.initialLayerX + (dx / state.zoom),
                        y: state.interaction.initialLayerY + (dy / state.zoom)
                    });
                } else if (state.interaction.type === 'resizing_layer' && state.selectedLayerId) {
                    // Calcul de la nouvelle distance par rapport au centre
                    const currentDist = Math.hypot(e.clientX - state.interaction.centerX, e.clientY - state.interaction.centerY);
                    if (state.interaction.startDist > 0) {
                        const ratio = currentDist / state.interaction.startDist;
                        // On limite l'échelle entre 0.05x et 10x
                        const newScale = Math.max(0.05, Math.min(state.interaction.initialScale * ratio, 10));
                        updateLayerData(state.selectedLayerId, { scale: newScale });
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (state.interaction.type !== 'none') {
                    state.interaction = { type: 'none', startX: 0, startY: 0 };
                    renderWorkspace(); // Update cursor
                }
            });

            // Raccourcis clavier (Espace)
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    if (!state.isSpacePressed) {
                        state.isSpacePressed = true;
                        renderWorkspace();
                    }
                }
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    state.isSpacePressed = false;
                    renderWorkspace();
                }
            });

            // Zoom à la molette
            DOM.workspace.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey || true) { // Toujours zoomer sur le workspace
                    e.preventDefault();
                    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                    state.zoom = Math.max(0.1, Math.min(state.zoom * zoomFactor, 5));
                    updateWorkspaceTransform();
                }
            }, { passive: false });

            // Outils et UI
            DOM.btnToolPointer.addEventListener('click', () => toggleTool('pointer'));
            DOM.btnToolHand.addEventListener('click', () => toggleTool('hand'));
            DOM.btnZoomIn.addEventListener('click', () => { state.zoom = Math.min(5, state.zoom + 0.1); updateWorkspaceTransform(); });
            DOM.btnZoomOut.addEventListener('click', () => { state.zoom = Math.max(0.1, state.zoom - 0.1); updateWorkspaceTransform(); });
            DOM.btnZoomReset.addEventListener('click', () => { state.zoom = 1; state.pan = {x:0, y:0}; updateWorkspaceTransform(); });

            // Aperçu (Cacher le débordement)
            DOM.btnTogglePreview.addEventListener('click', () => {
                state.ui.previewMode = !state.ui.previewMode;
                if (state.ui.previewMode) {
                    DOM.artboardContainer.classList.remove('overflow-visible');
                    DOM.artboardContainer.classList.add('overflow-hidden');
                    DOM.artboardMask.classList.add('hidden');
                    DOM.btnTogglePreview.classList.replace('text-neutral-400', 'text-blue-400');
                    DOM.iconPreview.setAttribute('data-lucide', 'eye-off');
                } else {
                    DOM.artboardContainer.classList.remove('overflow-hidden');
                    DOM.artboardContainer.classList.add('overflow-visible');
                    DOM.artboardMask.classList.remove('hidden');
                    DOM.btnTogglePreview.classList.replace('text-blue-400', 'text-neutral-400');
                    DOM.iconPreview.setAttribute('data-lucide', 'eye');
                }
                lucide.createIcons();
            });

            // Plein écran
            DOM.btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Erreur lors du passage en plein écran: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    DOM.iconFullscreen.setAttribute('data-lucide', 'minimize');
                } else {
                    DOM.iconFullscreen.setAttribute('data-lucide', 'maximize');
                }
                lucide.createIcons();
            });

            // Panneaux latéraux
            DOM.btnToggleLeft.addEventListener('click', () => {
                state.showLeftPanel = !state.showLeftPanel;
                if(state.showLeftPanel) {
                    DOM.panelLeft.classList.replace('panel-left-closed', 'panel-left-open');
                    document.getElementById('icon-panel-left').setAttribute('data-lucide', 'panel-left-close');
                } else {
                    DOM.panelLeft.classList.replace('panel-left-open', 'panel-left-closed');
                    document.getElementById('icon-panel-left').setAttribute('data-lucide', 'panel-left');
                }
                lucide.createIcons();
            });

            DOM.btnToggleRight.addEventListener('click', () => {
                state.showRightPanel = !state.showRightPanel;
                if(state.showRightPanel) {
                    DOM.panelRight.classList.replace('panel-right-closed', 'panel-right-open');
                    document.getElementById('icon-panel-right').setAttribute('data-lucide', 'panel-right-close');
                } else {
                    DOM.panelRight.classList.replace('panel-right-open', 'panel-right-closed');
                    document.getElementById('icon-panel-right').setAttribute('data-lucide', 'panel-right');
                }
                lucide.createIcons();
            });

            // Gestion de l'ouverture/fermeture des accordéons
            document.querySelectorAll('.toggle-accordion').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.getAttribute('data-target');
                    const content = document.getElementById(targetId);
                    const icon = btn.querySelector('i');
                    
                    if (content.classList.contains('hidden')) {
                        content.classList.remove('hidden');
                        icon.classList.remove('-rotate-90');
                    } else {
                        content.classList.add('hidden');
                        icon.classList.add('-rotate-90');
                    }
                });
            });

            // Liaisons des inputs du panneau de droite
            const propMap = {
                'opacity': parseFloat,
                'scale': parseFloat,
                'rotation': parseInt,
                'brightness': parseInt,
                'contrast': parseInt,
                'saturation': parseInt,
                'blur': parseInt,
                'shadowOpacity': parseFloat,
                'shadowAngle': parseInt,
                'shadowDistance': parseInt,
                'shadowBlur': parseInt,
                'shadowColor': (v) => v // string
            };

            for (const [key, parser] of Object.entries(propMap)) {
                DOM.inputs[key]?.addEventListener('input', (e) => {
                    if(!state.selectedLayerId) return;
                    updateLayerData(state.selectedLayerId, { [key]: parser(e.target.value) });
                });
            }

            // Liaisons spécifiques pour le rognage (objet imbriqué)
            ['cropTop', 'cropBottom', 'cropLeft', 'cropRight'].forEach(key => {
                DOM.inputs[key].addEventListener('input', (e) => {
                    if(!state.selectedLayerId) return;
                    const layer = getSelectedLayer();
                    const currentCrop = layer.crop || { top: 0, bottom: 0, left: 0, right: 0 };
                    const prop = key.replace('crop', '').toLowerCase(); // 'Top', 'Bottom'... -> 'top', 'bottom'
                    
                    updateLayerData(state.selectedLayerId, { 
                        crop: { ...currentCrop, [prop]: parseInt(e.target.value) } 
                    });
                });
            });

            // Liaisons des inputs du document
            DOM.btnUnitPx.addEventListener('click', () => {
                if(state.ui.unit !== 'px') { state.ui.unit = 'px'; populatePropertiesPanel(); }
            });
            DOM.btnUnitCm.addEventListener('click', () => {
                if(state.ui.unit !== 'cm') { state.ui.unit = 'cm'; populatePropertiesPanel(); }
            });

            DOM.inputDocWidth.addEventListener('change', (e) => {
                const val = parseFloat(e.target.value) || (state.ui.unit === 'cm' ? 21 : 794);
                state.artboard.width = state.ui.unit === 'cm' ? Math.round(val * CM_TO_PX) : Math.round(val);
                renderWorkspace();
            });
            DOM.inputDocHeight.addEventListener('change', (e) => {
                const val = parseFloat(e.target.value) || (state.ui.unit === 'cm' ? 29.7 : 1123);
                state.artboard.height = state.ui.unit === 'cm' ? Math.round(val * CM_TO_PX) : Math.round(val);
                renderWorkspace();
            });
            DOM.inputDocTransparent.addEventListener('change', (e) => {
                state.artboard.isTransparent = e.target.checked;
                DOM.inputDocBg.disabled = state.artboard.isTransparent;
                renderWorkspace();
            });
            DOM.inputDocBg.addEventListener('input', (e) => {
                state.artboard.bgColor = e.target.value;
                if (!state.artboard.isTransparent) renderWorkspace();
            });
        }

        // --- INITIALISATION ---
        lucide.createIcons();
        setupEventListeners();
        renderLayerList();
        populatePropertiesPanel();
        updateToolbarState();

    </script>
</body>
</html>
